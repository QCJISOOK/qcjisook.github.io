<title>제조업체 요약</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    color-scheme: light;
    --bg:            #f9f9f7;
    --surface:       #fcfcfb;
    --surface-2:     #f1f1ee;
    --surface-3:     #e8e8e4;
    --ink:           #0b0b0b;
    --ink-2:         #52514e;
    --muted:         #89877f;
    --border:        rgba(11,11,11,0.10);
    --border-strong: rgba(11,11,11,0.18);
    --accent:        #2a78d6;
    --accent-strong: #1b5fb0;
    --accent-tint:   #e6f0fb;
    --accent-ink:    #ffffff;

    --good:     #0ca30c;
    --good-tint: rgba(12,163,12,0.12);
    --warn:     #b9790a;
    --warn-tint: rgba(250,178,25,0.20);
    --serious:  #c1552f;
    --serious-tint: rgba(236,131,90,0.20);
    --critical: #d03b3b;
    --critical-tint: rgba(208,59,59,0.12);

    --t1: #2a78d6; --t1-tint: rgba(42,120,214,0.14);
    --t2: #c85c1f; --t2-tint: rgba(200,92,31,0.14);
    --t3: #128a63; --t3-tint: rgba(18,138,99,0.14);
    --t4: #a37a00; --t4-tint: rgba(163,122,0,0.16);
    --t5: #b1447c; --t5-tint: rgba(177,68,124,0.14);
    --t6: #4a7a1f; --t6-tint: rgba(74,122,31,0.14);
    --t7: #5a4aa0; --t7-tint: rgba(90,74,160,0.14);
    --t8: #6b6f66; --t8-tint: rgba(107,111,102,0.14);

    --shadow-sm: none;
    --shadow-md: 0 4px 14px rgba(11,11,11,0.07);
    --font-kr: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --font-mono: "Cascadia Code", "JetBrains Mono", Consolas, "SF Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --bg:            #0d100e;
      --surface:       #171c19;
      --surface-2:     #1e2420;
      --surface-3:     #262d27;
      --ink:           #f3f5f0;
      --ink-2:         #c3c9bd;
      --muted:         #838a80;
      --border:        rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.18);
      --accent:        #3aa891;
      --accent-strong: #5fc2ab;
      --accent-tint:   rgba(58,168,145,0.16);
      --accent-ink:    #04120e;

      --good:     #29c02f;
      --good-tint: rgba(41,192,47,0.16);
      --warn:     #f0b429;
      --warn-tint: rgba(240,180,41,0.18);
      --serious:  #ef8c63;
      --serious-tint: rgba(239,140,99,0.18);
      --critical: #e66767;
      --critical-tint: rgba(230,103,103,0.16);

      --t1: #3a7fc4; --t1-tint: rgba(58,127,196,0.20);
      --t2: #c06a35; --t2-tint: rgba(192,106,53,0.20);
      --t3: #1f9670; --t3-tint: rgba(31,150,112,0.20);
      --t4: #b5811a; --t4-tint: rgba(181,129,26,0.20);
      --t5: #c06a94; --t5-tint: rgba(192,106,148,0.20);
      --t6: #6ea043; --t6-tint: rgba(110,160,67,0.20);
      --t7: #7d70c4; --t7-tint: rgba(125,112,196,0.20);
      --t8: #9a9f93; --t8-tint: rgba(154,159,147,0.18);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:            #0d100e;
    --surface:       #171c19;
    --surface-2:     #1e2420;
    --surface-3:     #262d27;
    --ink:           #f3f5f0;
    --ink-2:         #c3c9bd;
    --muted:         #838a80;
    --border:        rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.18);
    --accent:        #3aa891;
    --accent-strong: #5fc2ab;
    --accent-tint:   rgba(58,168,145,0.16);
    --accent-ink:    #04120e;

    --good:     #29c02f;
    --good-tint: rgba(41,192,47,0.16);
    --warn:     #f0b429;
    --warn-tint: rgba(240,180,41,0.18);
    --serious:  #ef8c63;
    --serious-tint: rgba(239,140,99,0.18);
    --critical: #e66767;
    --critical-tint: rgba(230,103,103,0.16);

    --t1: #3a7fc4; --t1-tint: rgba(58,127,196,0.20);
    --t2: #c06a35; --t2-tint: rgba(192,106,53,0.20);
    --t3: #1f9670; --t3-tint: rgba(31,150,112,0.20);
    --t4: #b5811a; --t4-tint: rgba(181,129,26,0.20);
    --t5: #c06a94; --t5-tint: rgba(192,106,148,0.20);
    --t6: #6ea043; --t6-tint: rgba(110,160,67,0.20);
    --t7: #7d70c4; --t7-tint: rgba(125,112,196,0.20);
    --t8: #9a9f93; --t8-tint: rgba(154,159,147,0.18);
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --bg: #f5f6f1; --surface:#ffffff; --surface-2:#edefe8; --surface-3:#e4e7dd;
    --ink:#14201c; --ink-2:#4b564e; --muted:#8b9089;
    --border: rgba(20,32,28,0.10); --border-strong: rgba(20,32,28,0.18);
    --accent:#0b6b5c; --accent-strong:#084f44; --accent-tint:#e2efe9; --accent-ink:#ffffff;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font-kr);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{ background:var(--accent-tint); color:var(--ink); }

  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); font-weight:600;
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    max-width:1240px; margin:0 auto; padding:18px 20px 0;
    background:none; border:none;
  }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand-mark{
    width:28px; height:28px; border-radius:7px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-mark svg{ width:15px; height:15px; stroke:var(--accent-ink); }
  .brand-text{ line-height:1.2; }
  .brand-text .sub{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .brand-text .l2{ font-size:21px; font-weight:700; letter-spacing:-.01em; }

  .tabs{ display:flex; gap:4px; margin-left:8px; }
  .tab{
    appearance:none; border:1px solid transparent; background:transparent; cursor:pointer;
    padding:5px 14px; border-radius:7px; font-family:var(--font-kr); font-size:13px; font-weight:600;
    color:var(--ink-2); display:flex; align-items:center; gap:7px; transition:background .12s, color .12s;
  }
  .tab:hover{ background:var(--surface-2); }
  a.tab-ext{ text-decoration:none; }
  a.tab-ext .ext{ font-size:10px; opacity:.55; margin-left:2px; }
  .tab .n{ font-family:var(--font-mono); font-size:10px; opacity:.7; }
  .tab[aria-selected="true"]{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .tab[aria-selected="true"] .n{ color:#fff; opacity:.75; }
  .tab:hover:not([aria-selected="true"]){ color:var(--ink); }

  .topbar-meta{ margin-left:auto; text-align:right; }
  .topbar-meta .l1{ font-size:11px; color:var(--muted); }
  .topbar-meta .l2{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-2); }

  /* ---------- page shell ---------- */
  .page{ max-width:1240px; margin:0 auto; padding:14px 20px 56px; }
  .page[hidden]{ display:none; }

  .page-head{ margin-bottom:14px; }
  .page-head h1{
    font-size:20px; margin:2px 0 4px; font-weight:700; letter-spacing:-.01em;
    text-wrap:balance;
  }
  .page-head p{ margin:0; color:var(--ink-2); font-size:14.5px; max-width:62ch; line-height:1.6; }

  /* 페이지 제목 + 회사 마크 */
  .audit-head{ display:flex; align-items:center; gap:11px; margin-bottom:12px; }
  .ah-mark{ flex:none; width:34px; height:34px; color:var(--accent); }
  .ah-mark svg{ width:100%; height:100%; display:block; }
  .audit-head .ah-txt h1{ margin:2px 0 0; }
  .audit-head .eyebrow{ margin:0; }

  /* ---------- 대분류 필터 ---------- */
  .gfilter{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:11px 13px; margin-bottom:12px; box-shadow:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .gfilter.active{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint); }
  .gf-row{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .gf-row-b{ margin-top:9px; }
  .gf-row-b .gf-sel{ min-width:150px; }
  .gf-seg{ background:var(--surface-2); }
  .gf-seg .seg-b{ padding:5px 13px; font-size:12px; }
  .gf-sel{
    display:flex; align-items:center; gap:7px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:9px; padding:3px 4px 3px 11px;
  }
  .gf-sel:focus-within{ border-color:var(--accent); }
  .gf-sel > span{ font-size:11.5px; font-weight:700; color:var(--muted); white-space:nowrap; }
  .gf-sel select{
    background:none; border:none; font-family:var(--font-kr); font-size:12.5px; font-weight:600;
    color:var(--ink); cursor:pointer; padding:4px 6px 4px 0; max-width:150px;
  }
  .gf-sel select:focus{ outline:none; }
  .gf-search{
    display:flex; align-items:center; gap:7px; flex:1; min-width:210px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:3px 11px;
  }
  .gf-search:focus-within{ border-color:var(--accent); }
  .gf-search svg{ width:13px; height:13px; flex:none; stroke:var(--muted); fill:none; stroke-width:1.7; stroke-linecap:round; }
  .gf-search input{
    flex:1; min-width:0; background:none; border:none; padding:5px 0;
    font-family:var(--font-kr); font-size:12.5px; color:var(--ink);
  }
  .gf-search input:focus{ outline:none; }
  .gf-search input::placeholder{ color:var(--muted); }
  .gf-count{ margin-left:auto; font-size:11.5px; color:var(--muted); font-family:var(--font-mono); white-space:nowrap; }
  .gf-count b{ color:var(--accent-strong); font-size:13px; }
  .gf-row2{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:9px; }
  .gf-reset{
    background:none; border:1px solid var(--border); border-radius:8px; padding:4px 11px;
    font-size:11.5px; font-weight:700; color:var(--muted); cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .gf-reset:hover{ border-color:var(--border-strong); color:var(--ink); }
  .gf-reset.on{ border-color:var(--accent); color:var(--accent-strong); background:var(--accent-tint); }
  .gf-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .gf-chip{
    display:inline-flex; align-items:center; gap:5px; background:var(--accent-tint); color:var(--accent-strong);
    border:none; border-radius:100px; padding:4px 9px 4px 7px; font-size:11.5px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .gf-chip .gk{ font-size:9.5px; opacity:.72; font-weight:800; }
  .gf-chip i{ font-style:normal; font-size:10px; opacity:.6; }
  .gf-chip:hover{ background:var(--accent); color:#fff; }
  .gf-chip:hover i, .gf-chip:hover .gk{ opacity:.9; }

  /* ---------- KPI tiles ---------- */
  .kpi-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:12px; }
  .kpi{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; display:flex; flex-direction:column; gap:7px;
    box-shadow:none;
  }
  .kpi-top{ display:flex; align-items:flex-start; justify-content:space-between; }
  .kpi-icon{
    width:26px; height:26px; border-radius:7px; background:var(--accent-tint);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .kpi-icon svg{ width:16px; height:16px; stroke:var(--accent); fill:none; }
  .kpi-label{ font-size:12px; color:var(--ink-2); font-weight:500; }
  /* 타일 높이를 서로 맞춘다 — 값 영역 고정 + 각주를 바닥에 고정 */
  .kpi-value{
    font-family:var(--font-mono); font-size:26px; font-weight:700; letter-spacing:-.01em;
    display:flex; align-items:baseline; min-height:34px;
  }
  .kpi-value sup{ font-family:var(--font-kr); font-size:14px; font-weight:600; color:var(--muted); margin-left:2px; }
  .kpi-foot{ margin-top:auto; }
  .kpi-foot{ font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

  /* AUDIT 페이지 요약 지표 — 3칸 */
  .kpi-row.kpi-3{ grid-template-columns:repeat(3,1fr); margin-bottom:18px; }
  .kpi-row.kpi-4{ margin-bottom:18px; }

  /* 요약 — 업체별 감사 ↔ 이슈 대조 */
  .cx-row{ cursor:pointer; }
  .cx-row:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  /* 감사 이력이 없는 업체는 한눈에 구분되게 */
  .cx-row.no-audit td:first-child{ box-shadow:inset 3px 0 0 var(--warn); }
  .cx-n{ font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-left:4px; }
  #cross-table td{ vertical-align:middle; }
  #cross-table .chip{ margin-left:6px; }
  .kpi-value.name{ font-family:var(--font-kr); font-size:24px; letter-spacing:-.02em; }
  .kpi-value.name sup{ font-family:var(--font-mono); font-size:13px; font-weight:700; color:var(--ink-2); margin-left:5px; top:-.15em; }
  .kpi-best, .kpi-worst{ cursor:pointer; transition:border-color .15s, box-shadow .15s, transform .1s; }
  .kpi-best:hover, .kpi-worst:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }
  .kpi-best{ border-left:3px solid var(--good); }
  .kpi-best:hover{ border-color:var(--good); }
  .kpi-best .kpi-icon{ background:var(--good-tint); } .kpi-best .kpi-icon svg{ stroke:var(--good); }
  .kpi-worst{ border-left:3px solid var(--serious); }
  .kpi-worst:hover{ border-color:var(--serious); }
  .kpi-worst .kpi-icon{ background:var(--serious-tint); } .kpi-worst .kpi-icon svg{ stroke:var(--serious); }
  @media (max-width:920px){ .kpi-row.kpi-3{ grid-template-columns:1fr; } }

  .chip{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:100px;
    font-size:11.5px; font-weight:700; line-height:1.5; white-space:nowrap;
  }
  .chip::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }
  .chip-good{ background:var(--good-tint); color:var(--good); }
  .chip-warn{ background:var(--warn-tint); color:var(--warn); }
  .chip-serious{ background:var(--serious-tint); color:var(--serious); }
  .chip-muted{ background:var(--surface-2); color:var(--ink-2); }
  .chip-muted::before{ display:none; }

  /* ---------- panel ---------- */
  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; box-shadow:none;
  }
  .panel + .panel{ margin-top:12px; }
  .panel-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap; }
  .panel-title{ font-size:14px; font-weight:700; letter-spacing:-.01em; }
  .panel-sub{ font-size:11.5px; color:var(--muted); }

  .chart-grid{ display:grid; grid-template-columns:1.15fr 1fr; gap:12px; margin-bottom:12px; align-items:stretch; }
  /* 12칼럼 — 카드 폭을 자유롭게 */
  .cards{ display:grid; grid-template-columns:repeat(12,1fr); gap:12px; margin-bottom:12px; align-items:start; }
  .c4{ grid-column:span 4; } .c6{ grid-column:span 6; } .c8{ grid-column:span 8; } .c12{ grid-column:span 12; }
  @media (max-width:1000px){ .c4,.c6,.c8{ grid-column:span 12; } }
  @media (max-width:920px){ .chart-grid{ grid-template-columns:1fr; } .kpi-row{ grid-template-columns:repeat(2,1fr);} }

  /* ---------- ranking bars ---------- */
  .rank-list{ display:flex; flex-direction:column; gap:10px; }
  .rank-row{ display:grid; grid-template-columns:120px 1fr 40px; align-items:center; gap:10px; }
  .rank-row .name{ font-size:12.5px; color:var(--ink-2); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-track{ position:relative; height:16px; background:var(--surface-2); border-radius:5px; overflow:hidden; }
  .rank-fill{ position:absolute; inset:0 auto 0 0; border-radius:5px; background:var(--accent); }
  .rank-row .val{ font-family:var(--font-mono); font-size:12.5px; font-weight:700; text-align:right; color:var(--ink); }
  .rank-row.hi .name, .rank-row.hi .val{ color:var(--ink); }
  .rank-row.hi .rank-fill{ background:var(--accent-strong); }

  /* 유형 차트의 중분류 머리글 */
  .tx-mid{
    display:flex; align-items:baseline; gap:7px; margin:10px 0 3px;
    font-size:10.5px; font-weight:800; letter-spacing:.05em; color:var(--tc,var(--muted));
  }
  .tx-mid:first-child{ margin-top:0; }
  .tx-mid::before{ content:""; width:9px; height:2px; background:var(--tc,var(--muted)); border-radius:2px; }
  .tx-mid i{ font-style:normal; font-family:var(--font-mono); font-weight:700; color:var(--muted); }
  .tb2{ display:inline-flex; align-items:center; gap:5px; flex-wrap:wrap; row-gap:3px; }
  .tb2 i{ font-style:normal; font-size:10px; font-weight:700; color:var(--muted); }
  .type-row .rank-fill{ background:var(--tc,var(--accent)); }
  .type-row .swatch{ width:8px; height:8px; border-radius:2px; background:var(--tc,var(--accent)); display:inline-block; margin-right:6px; flex-shrink:0; }
  .type-row .name{ display:flex; align-items:center; }

  /* ---------- bar chart (yearly) ---------- */
  .barchart{ display:flex; align-items:stretch; gap:14px; padding-top:24px; }
  .barchart .col{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:7px; }
  .barchart .barea{ width:100%; height:118px; display:flex; align-items:flex-end; justify-content:center; }
  .barchart .stack{ width:100%; max-width:56px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .barchart .bar{ width:100%; border-radius:6px 6px 3px 3px; background:var(--accent); position:relative; min-height:3px; }
  .barchart .bar .v{ position:absolute; top:-20px; left:0; right:0; text-align:center; font-family:var(--font-mono); font-size:13px; font-weight:700; }
  .barchart .lbl{ font-size:12.5px; color:var(--ink-2); font-weight:700; font-family:var(--font-mono); }
  .barchart .col.hi .bar{ background:var(--accent-strong); }

  /* 연도 아래 제조사 목록 */
  .yr-cos{ width:100%; display:flex; flex-direction:column; gap:4px; padding-top:7px; border-top:1px solid var(--border); }
  .yr-co{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--accent);
    border-radius:7px; padding:5px 7px; font-family:inherit; font-size:11.5px; font-weight:700; color:var(--ink);
    cursor:pointer; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:background .15s, border-color .15s, transform .1s;
  }
  .yr-co{ display:flex; flex-direction:column; gap:1px; line-height:1.35; }
  .yr-co:hover{ background:var(--accent-tint); border-color:var(--accent); color:var(--accent-strong); transform:translateY(-1px); }
  .yr-co.warn{ border-left-color:var(--warn); }
  .yr-co .co{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .yr-co .dt{
    font-family:var(--font-mono); font-size:9.5px; font-weight:600; color:var(--muted);
    letter-spacing:-.01em; white-space:nowrap;
  }
  .yr-co:hover .dt{ color:var(--accent-strong); }
  .yr-co .dt sup{ font-family:var(--font-kr); font-size:8px; margin-left:2px; opacity:.75; }
  .yr-co .dt.ap{ font-style:italic; }

  /* ---------- company cards (page 2) ---------- */
  .card-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:10px;
  }
  .co-card{
    text-align:left; cursor:pointer; border:1px solid var(--border); background:var(--surface-2);
    border-radius:12px; padding:13px 14px; display:flex; flex-direction:column; gap:8px;
    font-family:inherit; transition:border-color .15s, background .15s, transform .1s;
  }
  .co-card:hover{ border-color:var(--border-strong); transform:translateY(-1px); }
  .co-card.active{ background:var(--accent-tint); border-color:var(--accent); }
  .co-card .co-name{ font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .co-card .co-count{ font-family:var(--font-mono); font-size:22px; font-weight:800; color:var(--accent); }
  .co-card .co-count small{ font-family:var(--font-kr); font-size:11px; font-weight:600; color:var(--muted); margin-left:3px; }
  .co-card .co-tag{ font-size:10.5px; color:var(--ink-2); }
  .co-card.active .co-count{ color:var(--accent-strong); }

  /* ---------- filter bar ---------- */
  .filter-bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .filter-bar input[type="search"]{
    flex:1; min-width:180px; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:6px 10px; font-family:var(--font-kr); font-size:12.5px; color:var(--ink);
  }
  .filter-bar select{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:6px 8px; font-family:var(--font-kr); font-size:12.5px; color:var(--ink); cursor:pointer;
  }
  .filter-bar input::placeholder{ color:var(--muted); }
  .filter-bar input:focus, .filter-bar select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .filter-reset{
    background:none; border:1px solid var(--border); border-radius:9px; padding:8px 12px;
    font-size:12.5px; color:var(--ink-2); cursor:pointer; font-family:var(--font-kr); font-weight:600;
  }
  .filter-reset:hover{ border-color:var(--border-strong); color:var(--ink); }
  .result-count{ font-size:12px; color:var(--muted); margin-left:auto; font-family:var(--font-mono); }

  /* ---------- 이슈 상세 펼침 ---------- */
  tr.irow{ cursor:pointer; }
  tr.irow:hover td{ background:var(--surface-2); }
  tr.irow.open td{ background:var(--accent-tint); }
  .ir-caret{ display:inline-block; color:var(--muted); font-size:9px; margin-right:5px; transition:transform .15s; }
  tr.irow.open .ir-caret{ transform:rotate(90deg); color:var(--accent-strong); }
  tr.idet > td{ padding:0 !important; background:var(--surface-2); }
  /* 이슈 상세 — 클레임개요 / 발생원인 / 재발방지 3단 */
  .idt{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px; }
  .ixs{
    display:grid; grid-template-columns:34px minmax(0,1fr); gap:10px;
    align-items:stretch;
  }
  .ixs.has-side{ grid-template-columns:34px minmax(0,1fr) 300px; }
  @media (max-width:1080px){ .ixs.has-side{ grid-template-columns:34px minmax(0,1fr); } .ix-side{ grid-column:2; } }
  .ix-rail{
    display:flex; align-items:center; justify-content:center;
    writing-mode:vertical-rl; text-orientation:upright;
    font-size:11px; font-weight:800; letter-spacing:.08em; line-height:1.1;
    border-radius:8px; padding:10px 2px; background:var(--railbg); color:var(--rail);
  }
  .ixs.s1{ --rail:var(--accent-strong); --railbg:var(--accent-tint); }
  .ixs.s2{ --rail:var(--t2); --railbg:var(--t2-tint); }
  .ixs.s3{ --rail:var(--t4); --railbg:var(--t4-tint); }
  .ix-body{
    background:var(--surface-2); border-radius:9px; padding:13px 16px;
    border-left:4px solid var(--rail); min-width:0;
  }
  .ix-hr{ margin:10px 0 0; padding-top:9px; border-top:1px solid var(--border); }
  /* 발생원인 + 재발방지 가 우측 서류 패널 하나를 함께 쓴다 */
  .ix-pair{ display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:10px; align-items:start; }
  /* 세 구획을 위에서 아래로 한 줄로 세운다 */
  .ix-pair-main{ display:flex; flex-direction:column; gap:10px; min-width:0; }
  @media (max-width:1080px){ .ix-pair{ grid-template-columns:minmax(0,1fr); } }

  /* 세 구획의 글자를 한 벌로 — 라벨 10.5px/800/muted, 본문 13px/500/ink */
  .ix-name{ font-size:15px; font-weight:800; line-height:1.55; color:var(--ink); letter-spacing:-.01em; }
  .ix-lb, .ix-meta i, .ix-keep i, .ix-line i{
    font-style:normal; display:inline-block; flex:0 0 auto;
    font-size:10.5px; font-weight:800; letter-spacing:.04em; color:var(--muted);
  }
  .ix-lb{ margin-right:9px; vertical-align:1px; }
  .ix-meta i{ margin-right:7px; }
  .ix-keep i, .ix-line i{ white-space:nowrap; }

  .ix-meta{ display:flex; flex-wrap:wrap; gap:7px 24px; margin-top:10px; }
  .ix-meta span, .ix-keep span, .ix-line p, .ix-line b{
    font-size:13px; font-weight:500; line-height:1.7; color:var(--ink);
  }
  .ix-meta span{ white-space:nowrap; line-height:1.5; }
  .ix-meta em{ font-style:normal; color:var(--muted); font-weight:500; }
  .ix-keep{ display:flex; gap:9px; align-items:baseline; line-height:1.7; }

  .ix-line{ display:flex; align-items:baseline; gap:12px; }
  .ix-line + .ix-line{ margin-top:9px; padding-top:9px; border-top:1px solid var(--border); }
  .ix-line.col{ flex-direction:column; gap:5px; }
  .ix-line b{ font-weight:700; }
  .ix-line p{ margin:0; }
  /* 긴 본문은 세 줄만 보이고 '더 보기'로 편다 */
  .ix-body.clamp .ix-line.col p{
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .ix-more{
    margin-top:9px; background:none; border:0; padding:0; cursor:pointer; font-family:inherit;
    font-size:11.5px; font-weight:700; color:var(--accent-strong); display:flex; align-items:center; gap:5px;
  }
  .ix-more .car{ font-size:9px; transition:transform .15s; }
  .ix-more[aria-expanded="true"] .car{ transform:rotate(90deg); }
  .ix-none{ color:var(--muted); font-weight:500; }
  .ix-src{ font-size:10.5px; color:var(--muted); line-height:1.6; margin-top:9px; }
  .ix-src .mono{ font-family:var(--font-mono); }
  .ix-line .chip{ margin-left:auto; }

  /* 첨부 서랍 — 카드 아래 한 줄로 모은다 */
  .ix-att{ border:1px solid var(--border); border-radius:9px; background:var(--surface); overflow:hidden; margin-top:10px; }
  .ix-att.none{ padding:9px 12px; font-size:11.5px; color:var(--muted); }
  .ix-att-hd{
    width:100%; display:flex; align-items:center; gap:7px; text-align:left; cursor:pointer;
    background:none; border:0; padding:9px 12px; font-family:inherit; font-size:12px; color:var(--ink);
  }
  .ix-att-hd:hover{ background:var(--surface-2); }
  .ix-att-hd .car{ font-size:9px; color:var(--muted); transition:transform .15s; }
  .ix-att-hd[aria-expanded="true"] .car{ transform:rotate(90deg); color:var(--accent-strong); }
  .ix-att-hd b{ font-weight:800; }
  .ix-at-sum{ color:var(--muted); font-size:11.5px; font-weight:600; }
  .ix-at-sum em{ font-style:normal; opacity:.8; }
  .ix-att-body{ padding:2px 12px 12px; display:flex; flex-direction:column; gap:11px; border-top:1px solid var(--border); }
  .ix-att-body[hidden]{ display:none; }
  .ix-at-grp > i{
    display:block; font-style:normal; font-size:10.5px; font-weight:800; letter-spacing:.04em;
    color:var(--muted); margin:9px 0 5px;
  }
  .ix-at-row{ display:flex; gap:7px; flex-wrap:wrap; }
  .ix-at{
    width:78px; height:92px; border:1px solid var(--border); border-radius:7px; overflow:hidden;
    background:#fff; cursor:zoom-in; padding:0;
  }
  .ix-at:hover{ border-color:var(--accent); }
  .ix-at img{ width:100%; height:100%; object-fit:contain; object-position:top; display:block; }

  /* 우측 패널 — 사진 / 대책서 서류 */
  .ix-side{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .ix-sh{ font-size:10.5px; font-weight:800; letter-spacing:.04em; color:var(--muted); }
  /* 우측 패널은 접어 두어 카드가 길어지지 않게 한다 */
  button.ix-sh-btn{
    display:flex; align-items:center; gap:6px; width:100%; text-align:left;
    background:none; border:0; padding:2px 0; cursor:pointer; font-family:inherit;
  }
  button.ix-sh-btn:hover{ color:var(--ink-2); }
  button.ix-sh-btn .car{ font-size:9px; transition:transform .15s; }
  button.ix-sh-btn[aria-expanded="true"] .car{ transform:rotate(90deg); color:var(--accent-strong); }
  .ix-side:not(.open) .ix-shot img{ max-height:104px; }
  .ix-side:not(.open) .ix-thumbs{ max-height:60px; overflow:hidden; }
  .ix-side:not(.open) .ix-mail,
  .ix-side:not(.open) .ix-big-btn{ display:none; }
  .ix-side:not(.open) .ix-empty{ min-height:52px; padding:10px; font-size:11px; }
  .ix-shot{
    border:1px solid var(--border); border-radius:9px; overflow:hidden; background:#fff;
    cursor:zoom-in; padding:0; display:block; width:100%; position:relative;
  }
  .ix-shot:hover{ border-color:var(--accent); }
  .ix-shot img{ width:100%; height:auto; max-height:230px; object-fit:contain; object-position:top; display:block; }
  .ix-thumbs{ display:flex; gap:6px; flex-wrap:wrap; }
  .ix-thumb{
    width:52px; height:66px; border:1px solid var(--border); border-radius:6px;
    overflow:hidden; background:#fff; cursor:zoom-in; padding:0;
  }
  .ix-thumb:hover{ border-color:var(--accent); }
  .ix-thumb img{ width:100%; height:100%; object-fit:contain; object-position:top; display:block; }
  .ix-thumb.ph{ width:58px; height:58px; }
  .ix-thumb.ph img{ object-fit:cover; object-position:center; }
  .ix-side .ix-sh em{ font-style:normal; font-weight:600; color:var(--muted); }
  .ix-mail.tight{ margin-top:4px; }
  .ix-mdup{ font-size:10.5px; color:var(--muted); margin-bottom:2px; }
  /* 대책서 본문 (텍스트가 뽑히는 PDF) */
  .ix-doc{ margin-top:10px; padding-top:9px; border-top:1px solid var(--border); }
  .ix-docbtn{
    width:100%; display:flex; align-items:center; gap:7px; text-align:left; cursor:pointer;
    background:none; border:0; padding:0; font-family:inherit; font-size:11.5px;
    font-weight:800; letter-spacing:.03em; color:var(--accent-strong);
  }
  .ix-docbtn .car{ font-size:9px; transition:transform .15s; }
  .ix-docbtn[aria-expanded="true"] .car{ transform:rotate(90deg); }
  .ix-docbtn .fn{ font-weight:600; color:var(--muted); font-size:10.5px; margin-left:auto;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:52%; }
  .ix-docbody{
    margin-top:8px; font-size:12.5px; line-height:1.75; color:var(--ink-2);
    white-space:pre-wrap; word-break:break-word; background:var(--surface);
    border:1px solid var(--border); border-radius:9px; padding:11px 13px;
    max-height:340px; overflow-y:auto;
  }
  .ix-docbody[hidden]{ display:none; }
  .ix-docbody.pgs{ background:transparent; border:0; padding:6px 0 0; max-height:none; font-family:inherit; }
  .ix-at-pg{ width:104px; height:138px; }

  /* 클레임 메일 */
  .ix-mail{ display:flex; flex-direction:column; gap:7px; }
  .ix-mi{ border:1px solid var(--border); border-radius:9px; background:var(--surface); overflow:hidden; }
  .ix-mh{
    width:100%; display:flex; align-items:flex-start; gap:8px; text-align:left;
    background:none; border:0; padding:9px 11px; cursor:pointer; font-family:inherit;
  }
  .ix-mh:hover{ background:var(--surface-2); }
  .ix-mh .car{ font-size:9px; color:var(--muted); margin-top:3px; transition:transform .15s; }
  .ix-mh[aria-expanded="true"] .car{ transform:rotate(90deg); color:var(--accent-strong); }
  .ix-mt{ flex:1; min-width:0; }
  .ix-mt b{ display:block; font-size:12px; font-weight:700; color:var(--ink); line-height:1.45; }
  .ix-mt i{ font-style:normal; font-family:var(--font-mono); font-size:10.5px; color:var(--muted); }
  .ix-mb{
    padding:0 12px 11px; font-size:12.5px; line-height:1.75; color:var(--ink-2);
    white-space:pre-wrap; word-break:break-word; border-top:1px solid var(--border); padding-top:10px;
  }
  .ix-mb[hidden]{ display:none; }
  .ix-empty{
    flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
    border:1px dashed var(--border-strong); border-radius:9px; padding:16px 12px;
    font-size:11.5px; color:var(--muted); line-height:1.6; min-height:96px;
  }
  /* 원본을 크게 — 접었다 펼 수 있게 */
  .ix-big-btn{
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:6px 10px; font-family:inherit; font-size:11px; font-weight:700; color:var(--ink-2);
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .ix-big-btn:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .ix-big-btn .car{ font-size:9px; transition:transform .15s; }
  .ix-big-btn[aria-expanded="true"] .car{ transform:rotate(90deg); }
  .ix-big{ display:flex; flex-direction:column; gap:10px; margin-top:2px; }
  .ix-big[hidden]{ display:none; }
  .ix-big figure{ margin:0; }
  .ix-big img{
    width:100%; max-width:920px; height:auto; display:block; cursor:zoom-in;
    border:1px solid var(--border); border-radius:9px; background:#fff;
  }
  .ix-big figcaption{ font-size:10.5px; color:var(--muted); margin-top:4px; }


  /* 대책서 확보 건은 행에서 바로 구분되게 */
  tr.irow.has-capa .title{ box-shadow:inset 3px 0 0 var(--good); padding-left:11px; }

  /* ---------- table ---------- */
  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:10px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:760px; }
  thead th{
    position:sticky; top:0; background:var(--surface-2); text-align:left; font-size:11.5px;
    color:var(--ink-2); font-weight:700; padding:7px 9px; border-bottom:1px solid var(--border-strong);
    white-space:nowrap; cursor:pointer; user-select:none;
  }
  thead th:hover{ color:var(--ink); }
  thead th .arrow{ font-family:var(--font-mono); font-size:10px; color:var(--accent); margin-left:3px; }
  tbody td{ padding:7px 9px; border-bottom:1px solid var(--border); vertical-align:top; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface-2); }
  tbody tr:nth-child(even){ background:color-mix(in srgb, var(--surface-2) 40%, transparent); }
  tbody tr:nth-child(even):hover{ background:var(--surface-2); }
  /* 이슈 표는 상세행이 끼어 있어 nth-child 줄무늬가 어긋난다 — 클래스로 직접 지정 */
  #issue-table tbody tr{ background:transparent; }
  #issue-table tbody tr.irow.alt{ background:color-mix(in srgb, var(--surface-2) 40%, transparent); }
  #issue-table tbody tr.irow:hover{ background:var(--surface-2); }
  td.num, th.num{ font-family:var(--font-mono); text-align:center; }
  td.note{ color:var(--ink-2); font-size:12px; max-width:230px; }
  td.title{ font-weight:600; max-width:250px; }
  td.date{ font-family:var(--font-mono); font-size:12px; color:var(--ink-2); white-space:nowrap; }
  th.date{ white-space:nowrap; }
  td.brand{ font-size:12px; font-weight:700; color:var(--ink-2); white-space:nowrap; }
  /* 원본에 값이 없는 칸 — 0 이나 공란과 구분되게 옅게 */
  .td-none{ color:var(--muted); opacity:.55; }
  /* 열 폭을 못 박아 헤더 글자가 잘리거나 칸이 밀리지 않게 한다 */
  #issue-table{ table-layout:fixed; min-width:1180px; }
  #issue-table td, #issue-table th{ padding-left:9px; padding-right:9px; word-break:break-word; }
  #issue-table col.c-seq{ width:42px; }
  #issue-table col.c-dt2{ width:104px; }
  #issue-table col.c-fa{ width:52px; }
  #issue-table .seq-th{ color:var(--muted); font-weight:700; }
  #issue-table .seq-td{ color:var(--muted); font-family:var(--font-mono); font-size:11.5px; font-variant-numeric:tabular-nums; }
  #issue-table col.c-no{ width:48px; }
  .fa-th{ font-size:10.5px; line-height:1.25; }
  .fa-td{ vertical-align:middle !important; }
  .fa-box{ width:15px; height:15px; cursor:pointer; accent-color:var(--serious); margin:0; }
  /* 귀책으로 표시한 행은 왼쪽에 띠를 둔다 */
  #issue-table tbody tr.irow.fault td:first-child{ box-shadow:inset 3px 0 0 var(--serious); }
  .fault-only{ border-color:var(--border); }
  .fault-only::before{
    content:""; display:inline-block; width:9px; height:9px; border-radius:2px;
    border:1.5px solid var(--serious); margin-right:6px; vertical-align:-1px;
  }
  .fault-only.on{ background:var(--serious-tint); border-color:var(--serious); color:var(--serious); }
  .fault-only.on::before{ background:var(--serious); }
  #fault-count{ color:var(--serious); margin-left:auto; }
  #fault-count b{ font-size:13px; }
  #issue-count{ margin-left:10px; }
  #issue-table col.c-co{ width:96px; }
  #issue-table col.c-br{ width:84px; }
  #issue-table col.c-pn{ width:72px; }
  #issue-table col.c-pr{ width:auto; }
  #issue-table col.c-dt{ width:104px; }
  #issue-table col.c-ty{ width:150px; }
  #issue-table col.c-cl{ width:190px; }
  #issue-table td.title, #issue-table td.note{ max-width:none; }
  #issue-table th{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #issue-table td.brand{ white-space:normal; display:table-cell; }

  .type-badge{
    display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:6px;
    font-size:11px; font-weight:700; white-space:nowrap;
  }
  .type-badge::before{ content:""; width:6px; height:6px; border-radius:2px; background:currentColor; }

  /* ---------- audit expand/detail row ---------- */
  .expand-btn{
    width:22px; height:22px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--ink-2); cursor:pointer; font-family:var(--font-mono); font-size:11px; line-height:1;
    display:flex; align-items:center; justify-content:center; transition:transform .15s, background .15s;
  }
  .expand-btn:hover{ background:var(--accent-tint); color:var(--accent-strong); }
  .expand-btn.open{ transform:rotate(90deg); }
  tr.detail-row{ background:var(--surface-2); }
  tr.detail-row.hidden{ display:none; }
  .detail-wrap{ padding:16px 14px 18px 42px; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:920px){ .detail-wrap{ grid-template-columns:1fr; } }
  .detail-card{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .detail-card h4{ margin:0 0 8px; font-size:12px; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; }
  .detail-card .empty{ font-size:12px; color:var(--muted); font-style:italic; }
  .score-compare{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .score-compare .box{ flex:1; text-align:center; padding:8px; border-radius:8px; background:var(--surface-2); }
  .score-compare .box .v{ font-family:var(--font-mono); font-size:20px; font-weight:800; }
  .score-compare .box .l{ font-size:10.5px; color:var(--muted); margin-top:2px; }
  .score-compare .gap{ font-family:var(--font-mono); font-size:11px; color:var(--muted); }
  .detail-card .score-note{ font-size:11.5px; color:var(--ink-2); line-height:1.5; }
  .complaint-list{ display:flex; flex-direction:column; gap:8px; max-height:260px; overflow-y:auto; }
  .complaint-item{ font-size:12px; line-height:1.5; padding-bottom:8px; border-bottom:1px dashed var(--border); }
  .complaint-item:last-child{ border-bottom:none; padding-bottom:0; }
  .complaint-item .ci-top{ display:flex; justify-content:space-between; gap:6px; font-weight:700; margin-bottom:2px; }
  .complaint-item .ci-type{ color:var(--accent); font-weight:600; font-size:11px; }
  .complaint-item .ci-detail{ color:var(--ink-2); }
  .complaint-item .ci-status{ font-size:10.5px; color:var(--muted); }
  .finaldoc-block{ font-size:12px; line-height:1.6; }
  .finaldoc-block .fd-label{ font-size:10.5px; font-weight:700; color:var(--ink-2); text-transform:uppercase; letter-spacing:.03em; margin-top:8px; }
  .finaldoc-block .fd-label:first-child{ margin-top:0; }

  /* ---------- 업체 × 연도 매트릭스 ---------- */
  .mx-legend{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .mxl{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); font-weight:600; }
  .mxl .sw{ width:11px; height:11px; border-radius:3px; display:inline-block; }
  .sw.ok{ background:var(--accent); }
  .sw.warn{ background:var(--warn); }
  .sw.dup{ background:var(--t8); }
  .sw.none{ background:var(--surface-3); border:1px solid var(--border); }

  .mx-wrap{ overflow-x:auto; }
  .mx{ display:grid; gap:6px; min-width:640px; }
  .mx-h{ font-size:11.5px; font-weight:800; color:var(--muted); text-align:center; padding:4px 0; }
  .mx-h.co{ text-align:left; padding-left:2px; }
  .mx-co{
    display:flex; flex-direction:column; justify-content:center; gap:2px;
    font-size:13px; font-weight:700; padding:6px 8px 6px 2px;
  }
  .mx-co .last{ font-size:10px; font-weight:600; color:var(--muted); }
  .mx-co .last.stale{ color:var(--serious); }
  .mx-cell{
    border-radius:9px; min-height:56px; padding:7px 8px; border:1px solid var(--border);
    background:var(--surface-3); display:flex; flex-direction:column; gap:3px; justify-content:center;
    font-family:inherit; text-align:left; cursor:default;
  }
  .mx-cell.has{ cursor:pointer; background:var(--accent-tint); border-color:var(--accent); }
  .mx-cell.has:hover{ box-shadow:0 0 0 2px var(--accent) inset; }
  .mx-cell.warn{ background:var(--warn-tint); border-color:var(--warn); }
  .mx-cell.dup{ background:var(--surface-2); border-color:var(--border-strong); }
  .mx-cell.sel{ box-shadow:0 0 0 2px var(--accent-strong) inset; }
  .mx-cell .q{ font-family:var(--font-mono); font-size:10.5px; font-weight:800; color:var(--ink-2); }
  .mx-cell .sc{ font-family:var(--font-mono); font-size:16px; font-weight:800; letter-spacing:-.01em; }
  .mx-cell .sc small{ font-size:9.5px; font-weight:600; color:var(--muted); margin-left:2px; }
  .mx-cell .fi{ font-size:10px; color:var(--ink-2); font-weight:600; }
  .mx-cell .empty{ font-size:11px; color:var(--muted); opacity:.45; text-align:center; }
  .mx-stack{ display:flex; flex-direction:column; gap:4px; }
  .mx-stack .mx-cell{ min-height:0; }

  /* 매트릭스 셀 클릭 → 상세 슬라이드 패널 */
  .mx-detail{
    margin-top:14px; border:1px solid var(--accent); border-radius:14px; overflow:hidden;
    background:var(--surface);
  }
  .mx-detail[hidden]{ display:none; }
  .mxd-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:13px 18px; background:var(--accent-tint); border-bottom:1px solid var(--border);
  }
  .mxd-title{ font-size:15px; font-weight:800; }
  .mxd-sub{ font-size:11.5px; color:var(--ink-2); margin-top:2px; }
  .mxd-close{
    background:var(--surface); border:1px solid var(--border); border-radius:8px; cursor:pointer;
    padding:5px 11px; font-size:12px; font-weight:700; color:var(--ink-2); font-family:inherit;
  }
  .mxd-close:hover{ border-color:var(--accent); color:var(--accent-strong); }

  /* ---------- 업체별 종합 점수 / 영역별 점수 ---------- */
  .mini-sel{
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:5px 9px; font-family:var(--font-kr); font-size:12px; color:var(--ink); cursor:pointer;
  }
  .mini-sel:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  /* 이슈 KPI — 상위 3개사 막대 */
  .kpi-top3 .t3{ display:flex; flex-direction:column; gap:4px; margin-top:auto; }
  .t3-row{ display:grid; grid-template-columns:26px 74px minmax(0,1fr) 22px; gap:7px; align-items:center; }
  /* 큰 이름 줄을 없앤 대신 순위 줄을 키운다 */
  .t3.big{ gap:11px; margin-top:6px; }
  .t3.big .t3-row{ grid-template-columns:34px minmax(0,1fr) 96px 34px; gap:10px; }
  .t3.big .t3-r{ font-size:11.5px; padding:3px 0; border-radius:6px; }
  .t3.big .t3-n{ font-size:15px; font-weight:800; color:var(--ink); }
  .t3.big .t3-row.r1 .t3-n{ font-size:17px; letter-spacing:-.01em; }
  .t3.big .t3-track{ height:9px; }
  .t3.big .t3-v{ font-size:15px; }
  .t3.big .t3-row.r1 .t3-v{ font-size:17px; color:var(--accent-strong); }
  .t3-r{
    font-family:var(--font-mono); font-size:9.5px; font-weight:800; text-align:center;
    color:var(--muted); background:var(--surface-2); border-radius:5px; padding:2px 0; line-height:1.25;
  }
  .t3-row.r1 .t3-r{ background:var(--accent-tint); color:var(--accent-strong); }
  .t3-n{ font-size:10.5px; font-weight:700; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .t3-row.r1 .t3-n{ color:var(--ink); font-weight:800; }
  .t3-track{ height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
  .t3-track i{ display:block; height:100%; background:var(--accent); border-radius:99px; }
  .t3-v{ font-family:var(--font-mono); font-size:11px; font-weight:800; text-align:right; color:var(--ink); }

  /* 연도를 지정했을 때 — 추이선 대신 큰 숫자 */
  .kpi-big .big-num{
    font-family:var(--font-mono); font-size:52px; font-weight:800; line-height:1.05;
    letter-spacing:-.02em; color:var(--accent-strong); display:flex; align-items:baseline;
    margin-top:2px;
  }
  .kpi-big .big-num sup{
    font-family:var(--font-kr); font-size:17px; font-weight:700; color:var(--muted);
    margin-left:4px; top:-.1em;
  }
  .kpi-big .big-sub{ font-size:12.5px; color:var(--ink-2); margin-top:2px; }
  .kpi-big .big-sub b{ font-family:var(--font-mono); font-weight:800; color:var(--ink); }

  /* 이슈 KPI — 연도 추이 스파크라인 */
  .kpi-trend .spark{ width:100%; height:46px; display:block; margin-top:2px; overflow:visible; }
  .sp-line{ fill:none; stroke:var(--accent); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .sp-dot{ fill:var(--surface); stroke:var(--accent); stroke-width:2; }
  .sp-dot.last{ fill:var(--accent); }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .sp-area{ fill:var(--accent); opacity:.10; stroke:none; }
  .sp-base{ stroke:var(--border); stroke-width:1; }
  /* 점 — 표면색 고리를 둘러 선 위에서도 또렷하다 */
  .sp-dots{ position:absolute; inset:0; pointer-events:none; }
  .sp-d{
    position:absolute; width:10px; height:10px; margin:0 0 -5px -5px;
    border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 2px var(--surface);
  }
  .sp-d.zero{ width:7px; height:7px; margin:0 0 -3.5px -3.5px; background:var(--muted); opacity:.5; }
  .sp-d.last{
    width:13px; height:13px; margin:0 0 -6.5px -6.5px; background:var(--accent-strong);
    box-shadow:0 0 0 3px var(--surface), 0 0 0 6px var(--accent-tint);
  }
  /* 추이 그래프 — 점 위에 건수를 얹는다 */
  .sp-wrap{ position:relative; height:116px; margin-top:12px; }
  .kpi-trend .spark.big{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .sp-lab{ position:absolute; inset:0; pointer-events:none; }
  .sp-lab span{
    position:absolute; transform:translate(-50%, -13px);
    font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--muted);
    white-space:nowrap; line-height:1; font-variant-numeric:tabular-nums;
  }
  .sp-lab span.on{ color:var(--accent-strong); font-size:16px; font-weight:800; transform:translate(-50%, -16px); }
  /* 점 위 마우스 자리 — 보이지 않지만 넉넉하게 */
  .sp-hits{ position:absolute; inset:0; }
  .sp-hit{
    position:absolute; width:34px; height:34px; margin:0 0 -17px -17px;
    background:none; border:0; padding:0; cursor:pointer; border-radius:50%;
  }
  .sp-hit:focus-visible{ outline:2px solid var(--accent); outline-offset:-4px; }
  .sp-tip{
    position:absolute; z-index:5; transform:translate(-50%, -100%);
    background:var(--ink); color:var(--surface); border-radius:8px;
    padding:7px 10px; font-size:11.5px; line-height:1.5; white-space:nowrap;
    pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .sp-tip[hidden]{ display:none; }
  .sp-tip b{ font-family:var(--font-mono); font-size:13px; font-weight:800; }
  .sp-tip i{ font-style:normal; display:block; margin-top:3px; font-family:var(--font-mono); font-weight:700; }
  .sp-tip i.up{ color:#ff9f8a; }
  .sp-tip i.down{ color:#8ee0b8; }
  .sp-tip i.flat{ opacity:.75; }
  .sp-ax{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:2px 8px; margin-top:16px; }
  .sp-ax span{ font-size:9.5px; color:var(--muted); white-space:nowrap; }
  .sp-ax span b{ font-family:var(--font-mono); font-weight:700; font-variant-numeric:tabular-nums; }
  .sp-ax span.on{ color:var(--accent-strong); font-weight:700; }
  .sp-ax span.on b{ font-weight:800; }
  .kpi-trend .kpi-foot{ flex-wrap:wrap; gap:5px; font-size:11px; }

  /* 이슈 차트 공용 필터 */
  .ifilter{ margin-bottom:12px; }
  .co-row, .type-row{ cursor:pointer; border-radius:7px; padding:2px 5px; margin:0 -5px; transition:background .12s; }
  .co-row:hover, .type-row:hover{ background:var(--surface-2); }
  .co-row.sel, .type-row.sel{ background:var(--accent-tint); }
  .co-row.sel .name{ color:var(--accent-strong); font-weight:800; }
  .type-row.sel .name{ font-weight:800; color:var(--ink); }
  /* 고르지 않은 유형은 뒤로 물러나게 */
  #issue-type-chart.picked .type-row:not(.sel){ opacity:.42; }

  /* 패널 전용 필터 */
  .pfilter{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    background:var(--surface-2); border:1px solid transparent; border-radius:10px;
    padding:7px 9px; margin-bottom:13px;
  }
  .pfilter.active{ border-color:var(--accent); background:var(--accent-tint); }
  .pf-q{
    flex:1 1 58%; min-width:140px; background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:5px 10px; font-family:var(--font-kr); font-size:12px; color:var(--ink);
  }
  .pf-q::placeholder{ color:var(--muted); }
  .pf-q:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .pfilter .mini-sel{ background:var(--surface); font-size:11.5px; padding:5px 7px; max-width:116px; }
  .pf-reset{
    background:none; border:1px solid var(--border); border-radius:8px; padding:4px 10px;
    font-size:11px; font-weight:700; color:var(--muted); cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .pf-reset:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .pf-fault::before{
    content:""; display:inline-block; width:8px; height:8px; border-radius:2px;
    border:1.5px solid var(--serious); margin-right:5px; vertical-align:-1px;
  }
  .pf-fault.on{ background:var(--serious-tint); border-color:var(--serious); color:var(--serious); }
  .pf-fault.on::before{ background:var(--serious); }
  .pf-fault.on:hover{ border-color:var(--serious); color:var(--serious); }
  /* 기간설정 — 시작월 ~ 종료월 */
  .pf-range{ display:inline-flex; align-items:center; gap:4px; }
  .pf-mon{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:4px 5px; font-family:var(--font-mono); font-size:11px; color:var(--ink);
    color-scheme:light dark; width:104px;
  }
  .pf-mon:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .pf-range i{ font-style:normal; color:var(--muted); font-size:11px; font-weight:700; }
  /* 상세표 필터 바에서는 다른 칸과 높이를 맞춘다 */
  .fb-range .pf-mon{ font-size:12.5px; padding:7px 8px; }
  .score-nos{
    margin-top:11px; padding-top:9px; border-top:1px dashed var(--border-strong);
    font-size:11px; color:var(--muted); line-height:1.6;
  }

  .score-list{ display:flex; flex-direction:column; gap:8px; }
  /* 비교 슬롯 표시 — 레이더 계열색과 순번을 그대로 보여준다 */
  .sc-slot{
    width:17px; height:17px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:10px; font-weight:800; color:#fff; line-height:1;
    background:transparent;
  }
  .score-row.s0 .sc-slot{ background:var(--t1); }
  .score-row.s1 .sc-slot{ background:var(--t2); }
  .score-row.s2 .sc-slot{ background:var(--t3); }
  .score-row.s0.sel{ border-color:var(--t1); background:var(--t1-tint); }
  .score-row.s1.sel{ border-color:var(--t2); background:var(--t2-tint); }
  .score-row.s2.sel{ border-color:var(--t3); background:var(--t3-tint); }
  .score-row.s0.sel .co, .score-row.s1.sel .co, .score-row.s2.sel .co{ color:var(--ink); }
  .cmp-note.swap{ background:var(--warn-tint); color:var(--warn); }

  .score-row{ display:grid; grid-template-columns:17px 104px 1fr 92px; align-items:center; gap:9px;
    padding:4px 6px; margin:0 -6px; border-radius:9px; border:1px solid transparent; transition:background .15s, border-color .15s; }
  .score-row:hover{ background:var(--surface-2); }
  .score-row.sel{ background:var(--accent-tint); border-color:var(--accent); }
  .score-row.sel .co{ color:var(--accent-strong); }
  .score-row .co{ font-size:12.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .score-row .co small{ display:block; font-size:10px; font-weight:600; color:var(--muted); }
  .score-track{ position:relative; height:19px; background:var(--surface-2); border-radius:5px; overflow:hidden; }
  .score-fill{ position:absolute; inset:0 auto 0 0; border-radius:5px; }
  .score-fill.olive{ background:var(--accent); }
  .score-fill.self{ background:var(--t8); opacity:.55; }
  .score-val{ display:flex; align-items:baseline; gap:4px; justify-content:flex-end; }
  .score-val .v{ font-family:var(--font-mono); font-size:14px; font-weight:800; }
  .score-val .tag{ font-size:9.5px; font-weight:700; padding:1px 5px; border-radius:4px; }
  .score-val .tag.olive{ background:var(--accent-tint); color:var(--accent-strong); }
  .score-val .tag.self{ background:var(--surface-2); color:var(--muted); }
  .score-empty{ font-size:11.5px; color:var(--muted); font-style:italic; padding:10px 2px; line-height:1.6; }

  .cat-split{ display:grid; grid-template-columns:132px 1fr; gap:14px; align-items:start; }
  @media (max-width:760px){ .cat-split{ grid-template-columns:1fr; } }
  .cat-colist{
    display:flex; flex-direction:column; gap:4px; max-height:270px; overflow-y:auto;
    border-right:1px solid var(--border); padding-right:10px;
  }
  @media (max-width:760px){ .cat-colist{ border-right:none; border-bottom:1px solid var(--border); padding:0 0 10px; flex-direction:row; flex-wrap:wrap; max-height:none; } }
  .cat-co{
    background:none; border:1px solid transparent; border-radius:8px; cursor:pointer; font-family:inherit;
    text-align:left; padding:7px 9px; display:flex; flex-direction:column; gap:1px; transition:background .15s, border-color .15s;
  }
  .cat-co:hover{ background:var(--surface-2); }
  .cat-co.on{ background:var(--accent-tint); border-color:var(--accent); }
  .cat-co .n{ font-size:12.5px; font-weight:700; color:var(--ink); }
  .cat-co .y{ font-family:var(--font-mono); font-size:10px; color:var(--muted); font-weight:600; }
  .cat-co.on .y{ color:var(--accent-strong); }
  .cat-co .noD{ font-size:9.5px; color:var(--muted); }

  /* ---------- 8각형 레이더 차트 ---------- */
  .cat-main{ min-width:0; }
  .radar{ width:100%; max-width:390px; height:auto; display:block; margin:0 auto; overflow:visible; }
  .rd-ring{ fill:none; stroke:var(--border); stroke-width:1; }
  .rd-ring.outer{ stroke:var(--border-strong); stroke-width:1.4; }
  .rd-axis{ stroke:var(--border); stroke-width:1; }
  .rd-scale{ fill:var(--muted); font-family:var(--font-mono); font-size:8.5px; opacity:.7; }
  .rd-area{ stroke-width:2; stroke-linejoin:round; }
  .rd-area.m{ fill:var(--t8); fill-opacity:.16; stroke:var(--t8); }
  .rd-area.d{ fill:var(--accent); fill-opacity:.20; stroke:var(--accent); }
  .rd-dot{ stroke:var(--surface); stroke-width:1.6; }
  .rd-dot.m{ fill:var(--t8); }
  .rd-dot.d{ fill:var(--accent); }
  .rd-lbl .c{ fill:var(--ink); font-family:var(--font-kr); font-size:11px; font-weight:700; }
  .rd-lbl .v{ fill:var(--ink-2); font-family:var(--font-mono); font-size:10.5px; font-weight:700; }
  .rd-lbl .v.bad{ fill:var(--critical); }
  .rd-lbl .arrow{ fill:var(--muted); }
  .dumb-legend .gapnote{ margin-left:auto; color:var(--ink-2); font-weight:700; }

  .dumb-list{ display:flex; flex-direction:column; gap:11px; }
  .dumb-row{ display:grid; grid-template-columns:100px 1fr 34px; align-items:center; gap:9px; }
  .dumb-row .cat{ font-size:12px; font-weight:700; color:var(--ink-2); }
  .dumb-track{ position:relative; height:16px; }
  .dumb-line{
    position:absolute; top:50%; height:2px; background:var(--border-strong); transform:translateY(-50%); border-radius:2px;
  }
  .dumb-dot{
    position:absolute; top:50%; width:11px; height:11px; border-radius:50%; transform:translate(-50%,-50%);
    border:2px solid var(--surface);
  }
  .dumb-dot.m{ background:var(--t8); }
  .dumb-dot.d{ background:var(--accent); }
  .dumb-row .n{ font-family:var(--font-mono); font-size:12.5px; font-weight:800; text-align:right; }
  .dumb-row.gapbig .n{ color:var(--critical); }
  .dumb-legend{ display:flex; gap:14px; margin-top:12px; padding-top:10px; border-top:1px solid var(--border); }
  .dl{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); font-weight:600; }
  .dl .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .dl .dot.m{ background:var(--t8); }
  .dl .dot.d{ background:var(--accent); }

  /* ---------- 업체 비교 모드 ---------- */
  .cat-ctrl{ display:flex; align-items:center; gap:8px; }
  .seg{ display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:2px; }
  .seg-b{
    background:none; border:none; cursor:pointer; font-family:inherit; border-radius:6px;
    padding:4px 10px; font-size:11px; font-weight:700; color:var(--muted); white-space:nowrap; transition:background .15s,color .15s;
  }
  .seg-b:hover{ color:var(--ink-2); }
  .seg-b.on{ background:var(--surface); color:var(--accent-strong); box-shadow:var(--shadow-sm); }
  .mini-sel:disabled{ opacity:.45; cursor:not-allowed; }

  .cmp-cap{ font-size:10.5px; font-weight:700; color:var(--muted); padding:2px 4px 6px; letter-spacing:.02em; }
  .cmp-cap b{ color:var(--accent-strong); }
  .cat-co.cmp{ flex-direction:row; align-items:center; gap:8px; }

  /* 영역별 위치 비교(점 그래프) */
  /* 비교 모드에서는 패널을 전체 폭으로 펴고 레이더 · 영역표를 나란히 */
  #score-grid.cmp-wide{ grid-template-columns:1fr !important; }

  #score-grid.cmp-wide .cat-colist{ max-height:none; }

  }

  .cd-wrap{ margin-top:14px; }
  .cd-row, .cd-head{
    display:grid; grid-template-columns:104px minmax(90px,1fr) auto 36px; align-items:center; gap:10px;
    padding:4px 0; border-bottom:1px solid var(--border);
  }
  .cd-row:hover{ background:var(--surface-2); }
  .cd-head{ border-bottom:1.5px solid var(--border-strong); padding-bottom:5px; margin-bottom:2px; }
  .cd-head .cd-cat, .cd-head .cd-gap{ font-size:10px; color:var(--muted); font-weight:700; }
  .cd-cat{ font-size:11.5px; font-weight:700; color:var(--ink-2); line-height:1.3; }
  .cd-track{ position:relative; height:26px; background:var(--surface-2); border-radius:5px; min-width:110px; }

  /* 눈금 — 50 · 60 · 70 · 80 · 90 · 100 */
  .cd-scale{ height:15px; }
  .cd-ax{
    position:absolute; top:1px; font-family:var(--font-mono); font-size:9.5px; font-weight:700;
    color:var(--muted); transform:translateX(-50%); white-space:nowrap;
  }
  .cd-ax.first{ transform:none; }
  .cd-ax.last{ transform:translateX(-100%); }
  .cd-grid{ position:absolute; top:3px; bottom:3px; width:1px; background:var(--border); }
  .cd-avg{

    cursor:help;
  }
  .cd-avg::after{ content:""; position:absolute; left:-6px; top:0; bottom:0; width:13px; }
  .cd-avg:hover{ border-left-color:var(--ink); opacity:1; }
  .cd-dot{
    position:absolute; width:10px; height:10px; border-radius:50%;
    transform:translate(-50%,-50%); border:1.5px solid var(--surface); box-shadow:0 0 0 1px rgba(0,0,0,.06);
    cursor:help; transition:transform .1s, box-shadow .1s;
  }
  .cd-dot:hover{ transform:translate(-50%,-50%) scale(1.5); box-shadow:0 0 0 3px var(--surface), 0 2px 6px rgba(0,0,0,.25); z-index:2; }
  .cd-vals b[data-tip]{ cursor:help; }

  /* 툴팁 */
  .cdtip{
    position:fixed; z-index:90; pointer-events:none;
    background:var(--ink); color:var(--surface); border-radius:8px; padding:7px 11px;
    font-size:12px; line-height:1.5; box-shadow:0 6px 20px rgba(0,0,0,.28);

  }
  .cdtip[hidden]{ display:none; }
  .cdtip b{ font-weight:750; font-size:12.5px; }
  .cdtip span{ font-family:var(--font-mono); font-size:11.5px; opacity:.85; }
  .cd-dot.s0{ background:var(--t1); } .cd-dot.s1{ background:var(--t2); } .cd-dot.s2{ background:var(--t3); }
  .cd-vals{ display:flex; gap:7px; font-family:var(--font-mono); font-size:12px; font-weight:800; }
  .cd-vals b{ min-width:22px; text-align:right; }
  .cd-vals .s0{ color:var(--t1); } .cd-vals .s1{ color:var(--t2); } .cd-vals .s2{ color:var(--t3); }
  .cd-vals .s-none{ color:var(--muted); font-weight:600; }
  .cd-vals b.low{ text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px; }
  .cd-head .cd-vals b{
    display:flex; align-items:center; justify-content:flex-end; gap:3px;
    font-family:var(--font-mono); font-size:10.5px; font-weight:800; min-width:22px; white-space:nowrap;
  }
  .hd-dot{ width:6px; height:6px; border-radius:50%; flex:none; }
  .hd-dot.s0{ background:var(--t1); } .hd-dot.s1{ background:var(--t2); } .hd-dot.s2{ background:var(--t3); }
  .cd-gap{ font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--muted); text-align:right; }
  .cd-gap.hi{ color:var(--warn); }
  .cd-row.wide .cd-cat{ box-shadow:inset 3px 0 0 var(--warn); padding-left:8px; }
  .cd-row.total{ border-bottom:none; border-top:1.5px solid var(--border-strong); margin-top:3px; padding-top:7px; }
  .cd-row.total .cd-cat{ color:var(--ink); font-weight:800; }

  .cmp-tbl-wrap{ margin-top:12px; overflow-x:auto; }
  .cmp-tbl{ width:100%; border-collapse:collapse; font-size:11.5px; }
  .cmp-tbl th, .cmp-tbl td{ padding:6px 8px; border-bottom:1px solid var(--border); text-align:center; white-space:nowrap; }
  .cmp-tbl th{ font-size:10.5px; font-weight:700; color:var(--ink-2); background:var(--surface-2); }
  .cmp-tbl th:first-child, .cmp-tbl td:first-child{ text-align:left; font-weight:700; color:var(--ink-2); white-space:normal; }
  .cmp-tbl td{ font-family:var(--font-mono); font-weight:700; color:var(--ink); }
  .cmp-tbl tr.wide td:first-child{ box-shadow:inset 3px 0 0 var(--warn); padding-left:11px; }
  .cmp-tbl td.low{ background:var(--surface-2); color:var(--critical); }
  .cmp-tbl tr.avg td{ border-top:1.5px solid var(--border-strong); border-bottom:none; background:var(--surface-2); }
  .th-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .th-dot.s0{ background:var(--t1); } .th-dot.s1{ background:var(--t2); } .th-dot.s2{ background:var(--t3); }
  /* 눈금 점수 — 행에 마우스를 올리면 50·60·70·80·90·100 이 뜬다 */
  .cd-grid[data-g]::after{
    content:attr(data-g); position:absolute; left:50%; bottom:-15px; transform:translateX(-50%);
    font-family:var(--font-mono); font-size:9.5px; font-weight:700; color:var(--muted);
    opacity:0; transition:opacity .12s; pointer-events:none; white-space:nowrap;
  }
  .cd-row:hover .cd-grid[data-g]::after{ opacity:1; }
  .cd-grid.edge{ opacity:.55; }
  .cd-row{ position:relative; }
  .cd-row:hover{ background:var(--surface-2); border-radius:8px; }
  .cd-row:hover .cd-track{ overflow:visible; }
  .cmp-hint{ font-size:10.5px; color:var(--muted); margin-top:7px; line-height:1.5; }
  .cmp-warn{ font-size:11.5px; color:var(--warn); background:var(--warn-tint); border-radius:8px; padding:8px 10px; margin-top:10px; line-height:1.5; }
  .cmp-note{
    font-size:11.5px; color:var(--accent-strong); background:var(--accent-tint);
    border-radius:8px; padding:7px 11px; margin-bottom:10px; line-height:1.55;
  }

  /* ---------- 조치 필요 목록 ---------- */
  .todo-list{ display:flex; flex-direction:column; gap:9px; }
  .todo-item{
    display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center;
    background:var(--surface-2); border-radius:10px; padding:10px 12px;
    border-left:3px solid var(--muted);

  .todo-item.crit .todo-n{ color:var(--critical); }
  .todo-item.warn .todo-n{ color:var(--warn); }

  .todo-t{ font-size:12.5px; font-weight:700; line-height:1.45; }

  }

  .clause-row{ cursor:pointer; }

  /* ---------- recurring findings panel ---------- */
  .rec-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; }
  .rec-item{ background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:13px 15px; }

    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .rec-name{ font-size:14px; font-weight:800; flex:1; min-width:0; }

    font-family:var(--font-mono); font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px;
    background:var(--surface); color:var(--ink-2); border:1px solid var(--border);
  }

  /* ---------- audit cards (page 1 main list) ---------- */
  .audit-cards{ display:flex; flex-direction:column; gap:12px; }
  .acard{
    border:1px solid var(--border); border-radius:14px; background:var(--surface);
    overflow:hidden; transition:border-color .15s, box-shadow .15s;
  }

    padding:16px 18px;

  .acard-when{ display:flex; flex-direction:column; gap:5px; }

  }

  .sbar-fill.dist{ background:var(--accent); }

  .sbar-gap.mid{ color:var(--warn); }

  .acard-stats{ display:flex; gap:8px; align-items:center; }

  /* ---------- AUDIT 3단계 흐름 ---------- */
  .phase{ border-bottom:1px solid var(--border); padding:16px 18px 20px; position:relative; }
  .phase:last-child{ border-bottom:none; }

  .phase.post{ background:color-mix(in srgb, var(--good) 5%, var(--surface-2)); }
  /* 단계 머리 = 펼침 버튼 */
  .ph-head{

  .phase.during .ph-num{ background:var(--accent); color:var(--accent-ink); }
