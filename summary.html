  .ph-title{ font-size:15px; font-weight:800; letter-spacing:-.01em; }
  .ph-sub{ font-size:11.5px; color:var(--muted); }
  .phase-body{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
  .doc-block{ background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:13px 15px; }
  .doc-block.wide{ grid-column:1 / -1; }
  .doc-label{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:10px; padding-bottom:8px; border-bottom:1px dashed var(--border); }
  .doc-name{ font-size:13px; font-weight:800; }
  .doc-desc{ font-size:10.5px; color:var(--muted); }
  .empty-note{ font-size:11.5px; color:var(--muted); font-style:italic; line-height:1.6; }

  .score-big{ display:flex; align-items:baseline; gap:4px; }
  .score-big .sv{ font-family:var(--font-mono); font-size:30px; font-weight:800; letter-spacing:-.02em; }
  .score-big .su{ font-size:12px; color:var(--muted); font-weight:600; }
  .score-cap{ font-size:11.5px; color:var(--ink-2); margin-top:3px; line-height:1.5; }
  .score-cap b.gap-hi{ color:var(--critical); }
  .score-cap b.gap-mid{ color:var(--warn); }
  .score-cap b.gap-lo{ color:var(--muted); }
  .gap-cap{ font-size:10.5px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }

  /* ---------- 불만협의체 (사전/사후) ---------- */
  .cx-sum{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:11px; }
  .cs-pill{
    display:flex; flex-direction:column; gap:1px; padding:6px 11px; border-radius:9px;
    background:var(--surface-2); font-size:11.5px; font-weight:700; color:var(--ink-2);
    border-left:3px solid var(--border-strong);
  }
  .cs-hd{ display:flex; align-items:baseline; gap:3px; white-space:nowrap; }
  .cs-pill b{ font-family:var(--font-mono); font-size:15px; font-weight:800; color:var(--ink); line-height:1; }
  .cs-pill em{ font-style:normal; font-size:10px; color:var(--muted); margin-right:3px; }
  .cs-pill i{ font-style:normal; font-size:10px; font-weight:600; color:var(--muted); white-space:nowrap; }
  .cs-pill.post{ border-left-color:var(--t2); }
  .cs-pill.pre{ border-left-color:var(--t1); }
  .cs-pill.alt{ border-left-color:var(--t7); }
  .cs-pill.open{ border-left-color:var(--warn); background:var(--warn-tint); }
  .cs-pill.open b{ color:var(--warn); }

  /* 구분 칩 = 펼침 버튼 — 아이콘 + 이름/건수 + 펼침 표시 */
  .cs-pill.tog{
    cursor:pointer; font-family:inherit; text-align:left;
    flex-direction:row; align-items:center; gap:10px; padding:8px 13px 8px 11px;
    border:1px solid var(--border); border-left-width:3px;
    transition:box-shadow .15s, transform .1s, background .15s;
  }
  .cs-pill.tog:hover{ box-shadow:var(--shadow-sm); transform:translateY(-1px); }
  .cs-ico{ flex:none; width:24px; height:24px; border-radius:7px; display:flex; align-items:center; justify-content:center; }
  .cs-ico svg{ width:15px; height:15px; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .cs-pill.post .cs-ico{ background:var(--t2-tint); } .cs-pill.post .cs-ico svg{ stroke:var(--t2); }
  .cs-pill.pre  .cs-ico{ background:var(--t1-tint); } .cs-pill.pre  .cs-ico svg{ stroke:var(--t1); }
  .cs-pill.alt  .cs-ico{ background:var(--t7-tint); } .cs-pill.alt  .cs-ico svg{ stroke:var(--t7); }
  .cs-pill.open .cs-ico{ background:var(--warn-tint); } .cs-pill.open .cs-ico svg{ stroke:var(--warn); }
  .cs-txt{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .cs-pill .cs-hd{ font-size:12px; font-weight:750; color:var(--ink); white-space:nowrap; }
  .cs-pill .cs-hd b{ font-family:var(--font-mono); font-size:13.5px; font-weight:800; margin-left:2px; }
  .cs-pill.post .cs-hd b{ color:var(--t2); }
  .cs-pill.pre  .cs-hd b{ color:var(--t1); }
  .cs-pill.open .cs-hd b{ color:var(--warn); }
  .cs-pill em{ font-style:normal; font-size:10px; color:var(--muted); margin-left:1px; }
  /* 펼침 표시 — 접힘 ▸ / 펼침 ▾ */
  .cs-car{
    flex:none; width:14px; height:14px; margin-left:2px; position:relative;
    border-right:2px solid var(--muted); border-bottom:2px solid var(--muted);
    transform:rotate(45deg) translate(-3px,-3px); transition:transform .18s, border-color .18s;
  }
  .cs-pill.tog[aria-expanded="true"]{ background:var(--accent-tint); border-color:var(--accent); }
  .cs-pill.tog[aria-expanded="true"] .cs-car{
    transform:rotate(225deg) translate(-3px,-3px); border-color:var(--accent-strong);
  }
  .cs-pill.open[aria-pressed="true"]{ background:var(--warn); }
  .cs-pill.open[aria-pressed="true"] b,
  .cs-pill.open[aria-pressed="true"] .cs-hd,
  .cs-pill.open[aria-pressed="true"] i,
  .cs-pill.open[aria-pressed="true"] em{ color:#fff; }
  .cx-all{ display:flex; align-items:center; margin-left:auto; }
  .cx-allbtn{
    background:none; border:1px solid var(--border); border-radius:7px; cursor:pointer;
    padding:5px 11px; font-size:11px; font-weight:700; color:var(--muted); font-family:inherit; white-space:nowrap;
  }
  .cx-allbtn:hover{ border-color:var(--accent); color:var(--accent-strong); }
  .cx-group[hidden]{ display:none; }
  .cx2[hidden]{ display:none; }

  .cx-group{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .cx-group:last-of-type{ margin-bottom:0; }
  .cx{
    display:grid; grid-template-columns:52px 1fr; gap:10px; align-items:stretch;
    background:var(--surface-2); border-radius:9px; overflow:hidden;
  }
  .cx-rail{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    padding:8px 4px; background:var(--border); color:var(--ink-2);
  }
  .cx.post .cx-rail{ background:var(--t2-tint); color:var(--t2); }
  .cx.pre  .cx-rail{ background:var(--t1-tint); color:var(--t1); }
  .cx.alt  .cx-rail{ background:var(--t7-tint); color:var(--t7); }
  .cx-kind{ font-size:10px; font-weight:800; letter-spacing:.02em; }
  .cx-no{ font-family:var(--font-mono); font-size:15px; font-weight:800; line-height:1; }
  .cx-main{ padding:8px 11px 9px 0; min-width:0; }
  .cx-head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:3px; }
  .cx-item{ font-size:12.5px; font-weight:700; line-height:1.4; }
  .cx-type{
    font-size:10px; font-weight:700; color:var(--accent-strong); background:var(--accent-tint);
    border-radius:100px; padding:1px 8px; white-space:nowrap;
  }
  .cx-detail{ font-size:12px; color:var(--ink-2); line-height:1.55; }
  .cx-foot{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .cx-foot .law-chips{ margin-top:0; }
  .cx-st{
    font-size:10.5px; font-weight:700; border-radius:100px; padding:2px 9px; white-space:nowrap;
    background:var(--surface); color:var(--ink-2); border:1px solid var(--border);
  }
  .cx-st.open{ background:var(--warn-tint); color:var(--warn); border-color:transparent; }
  .cx-st.done{ background:var(--good-tint); color:var(--good); border-color:transparent; }

  /* ---------- 자체평가 vs 올리브 평가 비교 ---------- */
  .sct-head{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--surface-2); border-radius:10px; padding:11px 15px; margin-bottom:11px;
  }
  .sct-pair{ display:flex; flex-direction:column; gap:1px; }
  .sct-pair .k{ font-size:10px; font-weight:800; color:var(--muted); letter-spacing:.03em; }
  .sct-pair b{ font-family:var(--font-mono); font-size:22px; font-weight:800; line-height:1.1; }
  .sct-pair b.self{ color:var(--muted); }
  .sct-pair b.olive{ color:var(--accent-strong); }
  .sct-arrow{ color:var(--muted); font-size:15px; }
  .sct-diff{
    margin-left:auto; font-size:11.5px; font-weight:700; color:var(--ink-2);
    background:var(--surface); border-radius:100px; padding:4px 12px;
  }
  .sct-diff.gap-hi{ color:var(--critical); }
  .sct-diff.gap-mid{ color:var(--warn); }

  /* 레이더 + 표 나란히 */
  .sct-split{ display:grid; grid-template-columns:320px minmax(0,1fr); gap:20px; align-items:start; }
  @media (max-width:820px){ .sct-split{ grid-template-columns:1fr; } }
  .sct-chart .radar.arad{ max-width:320px; }
  .sct-chart .dumb-legend{ margin-top:6px; padding-top:8px; justify-content:center; }

  /* 올리브가 낮게 본 항목 */
  .ow{ margin-top:13px; background:var(--surface-2); border-radius:10px; padding:11px 13px; }
  .ow-cap{ display:flex; align-items:center; gap:7px; font-size:12px; font-weight:800; color:var(--ink-2); margin-bottom:8px; }
  .ow-tag{ font-size:10.5px; font-weight:700; border-radius:100px; padding:2px 9px; }
  .ow-tag.bad{ background:var(--critical-tint); color:var(--critical); }
  .ow-tag.mid{ background:var(--warn-tint); color:var(--warn); }
  .ow-row{
    display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:10px; align-items:center;
    padding:6px 0; border-top:1px solid var(--border);
  }
  .ow-row:first-of-type{ border-top:none; }
  .ow-g{
    font-size:10.5px; font-weight:800; text-align:center; border-radius:5px; padding:3px 0;
    background:var(--warn-tint); color:var(--warn);
  }
  .ow-row.bad .ow-g{ background:var(--critical-tint); color:var(--critical); }
  .ow-t{ font-size:12.5px; color:var(--ink); line-height:1.5; }
  .ow-t i{ display:block; font-style:normal; font-size:9.5px; font-weight:700; color:var(--muted); }
  .ow-m{ font-size:10.5px; color:var(--muted); font-weight:700; white-space:nowrap; }

  /* 개선지시서 */
  .idr-cap{ font-size:11.5px; color:var(--muted); font-weight:700; margin-bottom:10px; }
  .idr-cap b{ color:var(--accent-strong); font-family:var(--font-mono); font-size:13px; }
  .idr-sec{ margin-bottom:13px; }
  .idr-sec:last-child{ margin-bottom:0; }
  .idr-h{
    font-size:12.5px; font-weight:800; color:var(--accent-strong); margin-bottom:7px;
    padding-bottom:4px; border-bottom:1px solid var(--border);
  }
  .idr-item{ display:grid; grid-template-columns:22px minmax(0,1fr); gap:9px; padding:6px 0; align-items:start; }
  .idr-no{
    font-family:var(--font-mono); font-size:11px; font-weight:800; text-align:center;
    background:var(--accent-tint); color:var(--accent-strong); border-radius:5px; padding:2px 0; margin-top:1px;
  }
  .idr-t{ font-size:13px; font-weight:700; line-height:1.55; color:var(--ink); }
  .idr-sub{ margin:5px 0 0; padding-left:15px; list-style:none; }
  .idr-sub li{
    position:relative; font-size:12px; line-height:1.65; color:var(--ink-2); padding:1px 0;
  }
  .idr-sub li::before{
    content:""; position:absolute; left:-11px; top:9px; width:4px; height:4px;
    border-radius:50%; background:var(--border-strong);
  }

  .sct-wrap{ overflow-x:auto; }
  .sct{ width:100%; border-collapse:collapse; font-size:12px; }
  .sct th{
    font-size:10.5px; font-weight:800; color:var(--ink-2); text-align:center;
    padding:7px 8px; background:var(--surface-2); white-space:nowrap;
    border-bottom:1.5px solid var(--border-strong);
  }
  .sct th:first-child{ text-align:left; }
  .sct td{ padding:6px 8px; border-bottom:1px solid var(--border); }
  .sct td.nm{ font-weight:600; color:var(--ink-2); }
  .sct td.num{ text-align:center; font-family:var(--font-mono); font-weight:700; font-variant-numeric:tabular-nums; }
  .sct td.num.lower{ color:var(--critical); }
  .sct td.gap b.dn{ color:var(--critical); }
  .sct td.gap b.up{ color:var(--good); }
  .sct-none{ color:var(--muted); font-weight:500; }
  .sct-same{ color:var(--muted); font-size:10.5px; font-weight:600; }
  .sct-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .sct-dot.self{ background:var(--muted); }
  .sct-dot.olive{ background:var(--accent); }
  .sct tr.wide td.nm{ box-shadow:inset 3px 0 0 var(--critical); padding-left:11px; }
  .sct tr.tot td{ border-top:1.5px solid var(--border-strong); border-bottom:none; background:var(--surface-2); font-weight:800; }
  .sct-cap{ font-size:10.5px; color:var(--muted); line-height:1.6; margin-top:8px; }

  /* ---------- 확인서 결과 ---------- */
  .cr-meta{ display:flex; gap:18px; flex-wrap:wrap; margin-bottom:10px; }
  .cr-meta span{ font-size:11.5px; color:var(--ink-2); }
  .cr-meta i{ font-style:normal; font-size:10px; font-weight:800; color:var(--muted); margin-right:6px; letter-spacing:.03em; }
  .cr-sum{ display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-bottom:11px; }
  .cr-tag{
    font-size:11px; font-weight:700; border-radius:100px; padding:3px 11px;
    background:var(--surface-2); color:var(--ink-2);
  }
  .cr-tag b{ font-family:var(--font-mono); font-size:12.5px; margin-left:3px; }
  .cr-tag.good{ background:var(--good-tint); color:var(--good); }
  .cr-tag.mid{ background:var(--warn-tint); color:var(--warn); }
  .cr-tag.bad{ background:var(--critical-tint); color:var(--critical); }
  .cr-tot{ font-size:10.5px; color:var(--muted); margin-left:auto; font-family:var(--font-mono); }
  .cr-sec{ margin-bottom:12px; }
  .cr-sec:last-child{ margin-bottom:0; }
  .cr-h{
    font-size:12px; font-weight:800; color:var(--accent-strong); margin-bottom:5px;
    padding-bottom:4px; border-bottom:1px solid var(--border);
  }
  .cr-row{
    display:grid; grid-template-columns:minmax(0,1fr) 52px; gap:10px; align-items:baseline;
    padding:5px 0 5px 9px; border-left:3px solid transparent;
  }
  .cr-row.good{ border-left-color:var(--good); }
  .cr-row.mid{ border-left-color:var(--warn); }
  .cr-row.bad{ border-left-color:var(--critical); background:var(--critical-tint); border-radius:0 6px 6px 0; }
  .cr-t{ font-size:12.5px; line-height:1.55; color:var(--ink); }
  .cr-t em{ display:block; font-style:normal; font-size:11px; color:var(--muted); margin-top:2px; line-height:1.55; }
  .cr-v{ font-size:11.5px; font-weight:800; text-align:right; white-space:nowrap; }
  .cr-row.good .cr-v{ color:var(--good); }
  .cr-row.mid .cr-v{ color:var(--warn); }
  .cr-row.bad .cr-v{ color:var(--critical); }

  /* ---------- 불만협의체 항목 — 3단 블록 + 우측 사진 ---------- */
  .cx3{
    display:grid; grid-template-columns:44px minmax(0,1fr) 318px; gap:12px;
    padding:12px; margin-bottom:10px;
    background:var(--surface); border:1px solid var(--border); border-radius:11px;
  }
  @media (max-width:960px){ .cx3{ grid-template-columns:44px minmax(0,1fr); } .c3-photo{ grid-column:2; } }
  .cx3-rail{
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:2px;
    padding:8px 3px; border-radius:8px; background:var(--border); color:var(--ink-2);
  }
  .cx3.post .cx3-rail{ background:var(--t2-tint); color:var(--t2); }
  .cx3.pre  .cx3-rail{ background:var(--t1-tint); color:var(--t1); }
  .cx3.alt  .cx3-rail{ background:var(--t7-tint); color:var(--t7); }
  .cx3-body{ display:flex; flex-direction:column; gap:8px; min-width:0; }

  .c3-box{ border-radius:9px; padding:13px 16px; }
  /* ① 제품 식별 — 진한 채움 대신 밝은 면 + 굵은 좌측 바 */
  .c3-box.id{
    background:var(--surface-2); border-left:4px solid var(--accent);
    border-radius:9px;
  }
  .c3-lb{
    display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.04em;
    color:var(--muted); margin-right:9px; vertical-align:1px;
  }
  .c3-name{ font-size:16px; font-weight:800; line-height:1.5; color:var(--ink); letter-spacing:-.01em; }
  .c3-meta{
    display:flex; flex-wrap:wrap; gap:7px 26px; margin-top:10px;
    padding-top:9px; border-top:1px solid var(--border);
  }
  .c3-meta span{
    font-family:var(--font-mono); font-size:13.5px; font-weight:800;
    white-space:nowrap; color:var(--ink); font-variant-numeric:tabular-nums;
  }
  .c3-meta i{
    font-style:normal; font-family:var(--font-kr); font-size:10.5px; font-weight:700;
    color:var(--muted); margin-right:7px; letter-spacing:.02em;
  }

  /* ②③ 내용 블록 */
  .c3-box.claim{ background:var(--surface-2); border-left:4px solid var(--t2); }
  .c3-box.reply{ background:var(--surface-2); border-left:4px solid var(--good); }
  .c3-box.reply.empty{ border-left-color:var(--warn); }
  .c3-line{ display:flex; align-items:baseline; gap:12px; }
  .c3-line + .c3-line{ margin-top:9px; padding-top:9px; border-top:1px solid var(--border); }
  .c3-line.col{ flex-direction:column; gap:5px; }
  .c3-line i{
    font-style:normal; font-size:10.5px; font-weight:800; color:var(--muted);
    letter-spacing:.04em; white-space:nowrap; flex:none;
  }
  .c3-line b{ font-size:14px; font-weight:800; color:var(--ink); }
  .c3-line p{ margin:0; font-size:13.5px; line-height:1.72; color:var(--ink); }
  .c3-box.reply .c3-line p{ color:var(--ink-2); }
  .c3-none{ color:var(--muted); font-weight:500; }
  .cx3 .law-chips{ margin-top:2px; }

  /* 우측 사진 */
  .c3-photo{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .c3-pmain{
    position:relative; flex:1; min-height:150px; padding:0; border:1px solid var(--border);
    border-radius:8px; overflow:hidden; background:#fff; cursor:zoom-in;
    transition:border-color .15s;
  }
  .c3-pmain:hover{ border-color:var(--accent); }
  .c3-pmain img{ width:100%; height:100%; max-height:250px; object-fit:cover; display:block; }
  .c3-pmain .zoom{
    position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.62); color:#fff;
    font-size:10px; font-weight:700; border-radius:5px; padding:3px 7px; pointer-events:none;
  }
  .c3-pmain:hover .zoom{ background:var(--accent); }
  .c3-pthumbs{ display:flex; gap:6px; flex-wrap:wrap; }
  .c3-pthumb{
    width:62px; height:48px; padding:0; border:1px solid var(--border); border-radius:6px;
    overflow:hidden; background:#fff; cursor:zoom-in;
  }
  .c3-pthumb:hover{ border-color:var(--accent); }
  .c3-pthumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .c3-nophoto{
    flex:1; display:flex; align-items:center; justify-content:center; min-height:120px;
    border:1px dashed var(--border-strong); border-radius:8px;
    font-size:11.5px; color:var(--muted);
  }

  /* ---------- 불만협의체 상세 (구 형식 — 데이터 없는 감사용) ---------- */
  .cx2{
    display:grid; grid-template-columns:52px minmax(0,1fr); gap:10px;
    background:var(--surface-2); border-radius:9px; overflow:hidden; margin-bottom:7px;
  }
  .cx2.has-pic{ grid-template-columns:52px minmax(0,1fr) auto; }
  .cx2-rail{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    padding:8px 4px; background:var(--border); color:var(--ink-2);
  }
  .cx2.post .cx2-rail{ background:var(--t2-tint); color:var(--t2); }
  .cx2.pre  .cx2-rail{ background:var(--t1-tint); color:var(--t1); }
  .cx2.alt  .cx2-rail{ background:var(--t7-tint); color:var(--t7); }
  .cx2-main{ padding:10px 12px 11px 0; min-width:0; }
  .cx2-head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .cx2-name{ font-size:13px; font-weight:750; line-height:1.45; }
  .cx2-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:7px;
    padding-bottom:9px; margin-bottom:9px; border-bottom:1px solid var(--border);
  }
  .cf{ min-width:0; }
  .cf-k{
    display:block; font-size:9.5px; font-weight:800; color:var(--muted);
    letter-spacing:.03em; margin-bottom:2px;
  }
  .cf-v{ display:block; font-size:12px; color:var(--ink); line-height:1.45; word-break:break-all; }
  .cf.mono .cf-v{ font-family:var(--font-mono); font-weight:700; }
  .cf-none{ font-style:normal; color:var(--muted); font-weight:500; }
  .cx2-body + .cx2-body{ margin-top:8px; }
  .cx2-detail{ font-size:12px; color:var(--ink-2); line-height:1.65; }
  .cx2-body.reply .cx2-detail{
    background:var(--surface); border-radius:7px; padding:8px 10px;
    border-left:3px solid var(--good); margin-top:3px;
  }
  .cx2-body.reply.empty .cx2-detail{ border-left-color:var(--warn); }
  .cx2 .law-chips{ margin-top:9px; }
  @media (max-width:820px){
    .cx2.has-pic{ grid-template-columns:52px minmax(0,1fr); }
    .cx2 .cx-pics{ grid-column:2; padding:0 9px 9px 0; flex-wrap:wrap; }
  }

  /* 불만 행 오른쪽에 붙는 사진 — 글과 사진을 같은 줄에 둬서 시선 이동을 줄인다 */
  .cx.has-pic{ grid-template-columns:52px minmax(0,1fr) auto; }
  .cx-pics{ display:flex; gap:5px; padding:8px 9px 8px 0; align-items:flex-start; }
  .cx-pic{
    position:relative; flex:none; width:112px; height:88px; padding:0; border:1px solid var(--border);
    border-radius:7px; overflow:hidden; background:#fff; cursor:zoom-in;
    transition:border-color .15s, transform .1s;
  }
  .cx-pic:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .cx-pic img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cx-pic .zoom{
    position:absolute; right:3px; bottom:3px; background:rgba(0,0,0,.6); color:#fff;
    font-size:10px; line-height:1; border-radius:4px; padding:3px 5px; pointer-events:none;
  }
  .cx-pic:hover .zoom{ background:var(--accent); }
  @media (max-width:820px){
    .cx.has-pic{ grid-template-columns:52px minmax(0,1fr); }
    .cx-pics{ grid-column:2; padding:0 9px 9px 0; flex-wrap:wrap; }
  }

  /* 불만협의체 첨부 사진 */
  .cxp{ margin-top:10px; }
  .cxp-cap{ font-size:10.5px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  .cxp-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .cxp-cell{
    position:relative; border:1px solid var(--border); border-radius:8px; overflow:hidden;
    background:#fff; cursor:zoom-in; aspect-ratio:4/3;
  }
  .cxp-cell img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cxp-cell .zoom{
    position:absolute; right:5px; bottom:5px; background:rgba(0,0,0,.62); color:#fff;
    font-size:9.5px; font-weight:700; border-radius:5px; padding:2px 6px;
  }
  .cxp-cell:hover .zoom{ background:var(--accent); }

  /* 점검시트 등급 토글 — A 우수 / B 보통 / C 미흡 */
  .sg{ margin-top:13px; }
  .sg-chips{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .sg-chip{
    display:flex; align-items:center; gap:8px; cursor:pointer; font-family:inherit;
    background:var(--surface-2); border:1px solid var(--border); border-left-width:3px;
    border-radius:9px; padding:7px 13px 7px 10px; transition:box-shadow .15s, transform .1s, background .15s;
  }
  .sg-chip:hover:not(:disabled){ box-shadow:var(--shadow-sm); transform:translateY(-1px); }
  .sg-chip:disabled{ opacity:.45; cursor:default; }
  .sg-chip.g-A{ border-left-color:var(--good); }
  .sg-chip.g-B{ border-left-color:var(--warn); }
  .sg-chip.g-C{ border-left-color:var(--critical); }
  .sg-k{
    width:20px; height:20px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:11px; font-weight:800; color:#fff;
  }
  .sg-chip.g-A .sg-k{ background:var(--good); }
  .sg-chip.g-B .sg-k{ background:var(--warn); }
  .sg-chip.g-C .sg-k{ background:var(--critical); }
  .sg-n{ font-size:11px; color:var(--muted); font-weight:700; }
  .sg-n b{ font-family:var(--font-mono); font-size:14px; font-weight:800; color:var(--ink); margin-right:1px; }
  .sg-l{ font-size:12px; font-weight:750; color:var(--ink); }
  .sg-chip[aria-expanded="true"]{ background:var(--accent-tint); border-color:var(--accent); }
  /* 올리브 평가 대비 격차 — 점수 옆에 붙는 값 */
  .sct-dv{
    font-family:var(--font-mono); font-size:12.5px; font-weight:800; margin-left:7px;
    padding:2px 8px; border-radius:100px; vertical-align:3px;
  }
  .sct-dv.up{ background:var(--good-tint); color:var(--good); }
  .sct-dv.dn{ background:var(--critical-tint); color:var(--critical); }

  /* 확인서 결과 — 판정별 묶음 */
  .sg-chip.cr-good{ border-left-color:var(--good); }
  .sg-chip.cr-mid{ border-left-color:var(--warn); }
  .sg-chip.cr-bad{ border-left-color:var(--critical); }
  .sg-chip.cr-good .sg-k{ background:var(--good); }
  .sg-chip.cr-mid .sg-k{ background:var(--warn); }
  .sg-chip.cr-bad .sg-k{ background:var(--critical); }
  .sg-chip .sg-k{ min-width:20px; padding:0 5px; width:auto; }
  .cr-list .cr-row2{
    display:grid; grid-template-columns:minmax(0,1fr) 44px; gap:11px; align-items:baseline;
    padding:7px 0; border-top:1px solid var(--border);
  }
  .cr-list .cr-row2:first-child{ border-top:none; }
  .cr-t2{ font-size:12.5px; line-height:1.55; color:var(--ink); }
  .cr-t2 i{ display:block; font-style:normal; font-size:9.5px; font-weight:700; color:var(--muted); }
  .cr-t2 em{ display:block; font-style:normal; font-size:11px; color:var(--muted); margin-top:2px; line-height:1.55; }
  .cr-v2{ font-size:11.5px; font-weight:800; text-align:right; white-space:nowrap; }
  .cr-row2.good .cr-v2{ color:var(--good); }
  .cr-row2.mid .cr-v2{ color:var(--warn); }
  .cr-row2.bad .cr-v2{ color:var(--critical); }
  .ow-sg{ margin-top:13px; }

  .sg-list{ background:var(--surface-2); border-radius:10px; padding:5px 13px; margin-bottom:8px; }
  .sg-list[hidden]{ display:none; }
  .sg-row{
    display:grid; grid-template-columns:26px minmax(0,1fr) auto; gap:11px; align-items:center;
    padding:7px 0; border-top:1px solid var(--border);
  }
  .sg-row:first-child{ border-top:none; }
  .sg-g{
    font-family:var(--font-mono); font-size:11px; font-weight:800; text-align:center;
    border-radius:5px; padding:3px 0; color:#fff;
  }
  .sg-row.g-A .sg-g{ background:var(--good); }
  .sg-row.g-B .sg-g{ background:var(--warn); }
  .sg-row.g-C .sg-g{ background:var(--critical); }
  .sg-t{ font-size:12.5px; color:var(--ink); line-height:1.5; min-width:0; }
  .sg-t i{ display:block; font-style:normal; font-size:9.5px; font-weight:700; color:var(--muted); }
  .sg-d{ font-size:10.5px; font-weight:700; white-space:nowrap; }
  .sg-d.same{ color:var(--muted); }
  .sg-d.worse{ color:var(--critical); }
  .sg-d.better{ color:var(--good); }
  .sg-d.none{ color:var(--muted); opacity:.7; }

  /* 업체 자체평가 중 '우수 아님' 항목 */
  .sw-box{ margin-top:12px; background:var(--surface-2); border-radius:10px; padding:10px 12px; }
  .sw-cap{ font-size:11.5px; color:var(--ink-2); font-weight:600; margin-bottom:8px; line-height:1.5; }
  .sw-cap b{ color:var(--warn); }
  .sw-row{ display:grid; grid-template-columns:42px 1fr auto; gap:9px; align-items:center; padding:5px 0; border-top:1px solid var(--border); }
  .sw-row:first-of-type{ border-top:none; }
  .sw-g{
    font-size:10px; font-weight:800; text-align:center; border-radius:5px; padding:3px 0;
    background:var(--warn-tint); color:var(--warn);
  }
  .sw-row.c .sw-g{ background:var(--critical-tint); color:var(--critical); }
  .sw-txt{ min-width:0; }
  .sw-cat{ display:block; font-size:9.5px; font-weight:700; color:var(--muted); }
  .sw-item{ display:block; font-size:11.5px; color:var(--ink); line-height:1.45; }
  .sw-d{ font-size:10px; font-weight:700; white-space:nowrap; color:var(--muted); }
  .sw-d.worse{ color:var(--critical); }
  .sw-d.better{ color:var(--good); }
  .sw-d.same{ color:var(--ink-2); }
  .sw-none{
    margin-top:12px; font-size:11.5px; color:var(--ink-2); background:var(--surface-2);
    border-radius:9px; padding:9px 12px; line-height:1.5;
  }
  .sw-none b{ color:var(--accent-strong); }

  /* ---------- 법적 근거 칩 ---------- */
  .law-chips{ display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .law-chip{
    display:inline-flex; align-items:center; gap:5px; cursor:pointer; font-family:inherit;
    border-radius:6px; padding:3px 8px; font-size:10.5px; font-weight:700; line-height:1.5;
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2);
    transition:border-color .15s, background .15s, color .15s;
  }
  .law-chip:hover{ border-color:var(--accent); background:var(--accent-tint); color:var(--accent-strong); }
  .law-chip .lc-tag{
    font-family:var(--font-mono); font-size:9px; font-weight:800; padding:1px 5px; border-radius:4px;
    background:var(--t8-tint); color:var(--t8);
  }
  .law-chip.force .lc-tag{ background:var(--critical-tint); color:var(--critical); }
  .law-chip.guide .lc-tag{ background:var(--t1-tint); color:var(--t1); }
  .law-chip .lc-art{ font-family:var(--font-mono); }
  .law-chip .lc-t{ font-weight:600; opacity:.85; }

  .law-badge{
    display:inline-block; font-size:10px; font-weight:800; padding:2px 8px; border-radius:5px; margin-right:6px;
  }
  .law-badge.force{ background:var(--critical-tint); color:var(--critical); }
  .law-badge.guide{ background:var(--t1-tint); color:var(--t1); }

  /* ---------- 법령 상세 모달 ---------- */
  .lawbox{
    position:fixed; inset:0; z-index:120; background:rgba(8,12,10,.72);
    display:flex; align-items:center; justify-content:center; padding:24px;
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  }
  .lawbox[hidden]{ display:none; }
  .lawbox-panel{
    background:var(--surface); border:1px solid var(--border-strong); border-radius:16px;
    max-width:720px; width:100%; max-height:86vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .lawbox-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
    padding:20px 22px 14px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface);
  }
  .lb-law{ font-size:12px; color:var(--ink-2); font-weight:700; margin-bottom:5px; }
  .lb-title{ font-size:19px; font-weight:800; letter-spacing:-.01em; }
  .lawbox-close{
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px; cursor:pointer;
    padding:6px 12px; font-size:12px; font-weight:700; color:var(--ink-2); font-family:inherit; flex-shrink:0;
  }
  .lawbox-close:hover{ background:var(--accent-tint); color:var(--accent-strong); }
  .lawbox-meta{ padding:14px 22px; background:var(--surface-2); display:flex; flex-direction:column; gap:7px; }
  .lm-row{ display:grid; grid-template-columns:104px 1fr; gap:10px; font-size:11.5px; line-height:1.55; }
  .lm-k{ color:var(--muted); font-weight:700; }
  .lm-v{ color:var(--ink-2); }
  .lawbox-body{ padding:18px 22px; }
  .lb-bodytitle{
    font-size:11px; font-weight:800; color:var(--accent); text-transform:uppercase;
    letter-spacing:.05em; margin-bottom:10px;
  }
  .lb-p{ margin:0 0 9px; font-size:13px; line-height:1.75; color:var(--ink); }
  .lb-p:last-child{ margin-bottom:0; }
  .lawbox-foot{
    padding:12px 22px 18px; font-size:10.5px; color:var(--muted); border-top:1px solid var(--border);
  }

  /* 최종 평가서 원본 페이지 */
  .ev{ margin-top:12px; }
  .ev-cap{ font-size:11.5px; color:var(--muted); font-weight:600; margin-bottom:8px; }
  .ev-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:10px; }
  .ev-page{
    position:relative; padding:0; border:1px solid var(--border); border-radius:9px;
    overflow:hidden; background:#fff; cursor:zoom-in; transition:border-color .15s, transform .1s;
  }
  .ev-page:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .ev-page img{ width:100%; height:auto; display:block; }
  .ev-no{
    position:absolute; left:7px; top:7px; background:rgba(0,0,0,.6); color:#fff;
    font-family:var(--font-mono); font-size:10px; font-weight:700; border-radius:5px; padding:2px 7px;
  }
  .ev-page:hover .ev-no{ background:var(--accent); }

  .ba-count{ font-size:11.5px; color:var(--ink-2); margin-bottom:10px; font-weight:600; }
  .find-hd{ display:flex; align-items:flex-start; gap:9px; }
  .find-ba{ display:flex; align-items:center; gap:7px; margin:10px 0 2px; flex-wrap:wrap; }
  .ba{
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:800; padding:4px 11px; border-radius:7px;
  }
  .ba i{ width:7px; height:7px; border-radius:50%; background:currentColor; display:inline-block; }
  .ba.b{ background:var(--critical-tint); color:var(--critical); }
  .ba.a{ background:var(--good-tint); color:var(--good); }
  .ba-arrow{ font-size:13px; color:var(--muted); font-weight:700; }
  .ba-note{ font-size:10.5px; color:var(--muted); margin-left:2px; }
  .sec{ margin-bottom:20px; }
  .sec:last-child{ margin-bottom:0; }
  .sec-title{
    display:flex; align-items:center; gap:8px; font-size:12px; font-weight:800;
    color:var(--accent); text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px;
  }
  .sec-title::after{ content:""; flex:1; height:1px; background:var(--border); }
  .sec-title .badge{
    background:var(--accent-tint); color:var(--accent-strong); border-radius:100px;
    padding:1px 8px; font-family:var(--font-mono); font-size:10.5px; letter-spacing:0;
  }

  /* finding items with inline photo */
  .find-list{ display:flex; flex-direction:column; gap:10px; }
  .find-item{
    background:var(--surface); border:1px solid var(--border); border-radius:11px; overflow:hidden;
  }
  /* 항목 머리 = 펼침 버튼 */
  .find-hd{
    width:100%; display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:11px;
    align-items:center; background:none; border:none; cursor:pointer; font-family:inherit;
    text-align:left; padding:12px 15px; transition:background .15s;
  }
  .find-hd:hover{ background:var(--surface-2); }
  .find-hd[aria-expanded="true"]{ background:var(--accent-tint); }
  .find-car{
    width:12px; height:12px; flex:none;
    border-right:2px solid var(--muted); border-bottom:2px solid var(--muted);
    transform:rotate(45deg) translate(-2px,-2px); transition:transform .18s, border-color .18s;
  }
  .find-hd[aria-expanded="true"] .find-car{
    transform:rotate(225deg) translate(-2px,-2px); border-color:var(--accent-strong);
  }
  .find-body{ padding:0 15px 14px; }
  .find-body[hidden]{ display:none; }
  @media (max-width:760px){
    .find-hd{ grid-template-columns:auto minmax(0,1fr) auto; }
    .find-hd .find-ba{ grid-column:2; }
  }
  .find-text{ padding:13px 15px; }
  .find-no{
    display:inline-block; background:var(--accent); color:var(--accent-ink); font-family:var(--font-mono);
    font-size:11px; font-weight:800; border-radius:6px; padding:2px 7px; margin-bottom:7px;
  }
  .find-title{ font-size:13.5px; font-weight:700; line-height:1.5; }
  /* 펼치면 원본을 크게 — 폭 전체를 쓴다 */
  .find-photo{
    background:#fff; cursor:zoom-in; position:relative;
    border:1px solid var(--border); border-radius:9px; overflow:hidden; margin-top:9px;
  }
  .find-photo:hover{ border-color:var(--accent); }
  .find-photo img{ width:100%; height:auto; display:block; max-height:none; }
  .find-photo.sum img{ max-height:none; }
  .find-photo .zoom{
    position:absolute; right:8px; bottom:8px; background:rgba(8,12,10,.72); color:#fff;
    font-size:10.5px; padding:3px 8px; border-radius:6px; font-weight:700; pointer-events:none;
  }
  .find-photo:hover .zoom{ background:var(--accent); }

  .txt-block{ font-size:12.5px; line-height:1.7; color:var(--ink-2); }
  .txt-block strong{ color:var(--ink); }
  .info-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; }
  .info-box{ background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:13px 15px; }
  .info-box h5{ margin:0 0 7px; font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }

  .gap-list{ display:flex; flex-direction:column; gap:5px; margin-top:9px; }
  .gap-row{ display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; font-size:11.5px; padding:5px 9px; background:var(--surface); border-radius:7px; }
  .gap-row .g-item{ color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gap-row .g-val{ font-family:var(--font-mono); font-weight:800; font-size:11px; white-space:nowrap; }
  .gap-row.down .g-val{ color:var(--critical); }
  .gap-row.up .g-val{ color:var(--good); }

  /* ---------- CAPA before/after gallery ---------- */
  .capa-card{ grid-column:1 / -1; }
  .capa-head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .capa-head .cnt{ font-family:var(--font-mono); font-size:11px; color:var(--muted); }
  .capa-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:12px; }
  .capa-item{
    border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--surface);
    cursor:zoom-in; display:flex; flex-direction:column; transition:border-color .15s, transform .1s;
    padding:0; font-family:inherit; text-align:left;
  }
  .capa-item:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .capa-item img{ width:100%; height:auto; display:block; background:#fff; }
  .capa-item .cap{ font-size:11px; line-height:1.45; padding:8px 10px; color:var(--ink-2); border-top:1px solid var(--border); }

  /* 전체화면 사진 뷰어 — 확대/이동 지원 */
  body.lb-open{ overflow:hidden; }
  .lightbox{
    position:fixed; inset:0; z-index:100; background:rgba(8,12,10,.94);
    display:grid; grid-template-rows:auto 1fr auto;
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  }
  .lightbox[hidden]{ display:none; }
  .lb-top{
    display:flex; align-items:center; gap:14px; padding:12px 18px;
    border-bottom:1px solid rgba(255,255,255,.10);
  }
  .lightbox .lb-cap{
    color:#fff; font-size:13.5px; line-height:1.5; font-weight:600; flex:1; min-width:0;
  }
  .lb-stage{
    position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;
    padding:10px; min-height:0;
  }
  .lb-stage img{
    max-width:100%; max-height:100%; width:auto; height:auto; display:block;
    border-radius:4px; background:#fff; box-shadow:0 12px 48px rgba(0,0,0,.55);
    transform-origin:center center; transition:transform .12s ease-out; user-select:none;
  }
  .lb-tools{
    display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;
    padding:11px 18px; border-top:1px solid rgba(255,255,255,.10);
  }
  .lightbox button{
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.22);
    border-radius:8px; padding:6px 13px; font-size:13px; cursor:pointer; font-family:inherit; font-weight:600;
    min-width:40px;
  }
  .lightbox button:hover:not(:disabled){ background:rgba(255,255,255,.24); }
  .lightbox button:disabled{ opacity:.3; cursor:default; }
  .lightbox button.on{ background:var(--accent); border-color:transparent; color:#fff; }
  .lightbox .lb-x{ flex:none; }
  .lightbox .lb-idx{ color:rgba(255,255,255,.8); font-family:var(--font-mono); font-size:12.5px; min-width:56px; text-align:center; }
  .lightbox .lb-z{ color:rgba(255,255,255,.8); font-family:var(--font-mono); font-size:12.5px; min-width:52px; text-align:center; }
  .lightbox .lb-div{ width:1px; height:20px; background:rgba(255,255,255,.18); margin:0 5px; }

  footer.note{
    margin-top:26px; padding-top:16px; border-top:1px solid var(--border);
    font-size:11.5px; color:var(--muted); line-height:1.7;
  }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  @media (max-width:680px){
    .topbar{ flex-wrap:wrap; padding:12px 16px; }
    .topbar-meta{ display:none; }
    .page{ padding:24px 16px 60px; }

const COS = ["그린코스","나우코스","뉴앤뉴","로드에프","리봄","메가코스","믹스앤매치","비앤비코리아","서울화장품","씨아이티","씨앤씨인터내셔널","씨앤텍","아이피어리스","엠앤코스","오투바이오","이미인","이앤씨","코디","코스맥스","코스메카","코스모코스","코코","콜마스크","한국콜마","한국BTB+리봄","해피엘엔비","화성코스메틱","CIT 코스메틱"];

const MID_OF = {}, SLOT_OF = {};
CLAIM_TAX.forEach(g=> g.subs.forEach(s=>{ MID_OF[s]=g.mid; SLOT_OF[s]=g.slot; }));
const MID_SLOT = {}; CLAIM_TAX.forEach(g=> MID_SLOT[g.mid]=g.slot);
const SUB_ORDER = {}; let _so=0; CLAIM_TAX.forEach(g=> g.subs.forEach(s=> SUB_ORDER[s]=_so++));
const CAT_ORDER = ["품질경영","검사","공정관리","작업장관리","협력업체관리","부적합관리","제품식별·추적성","5S관리"];

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function keyOf(d){ return d.company+"|"+d.issueNo+"|"+d.title; }
function fx(d){ return issueFix[keyOf(d)] || {}; }
function aKey(a){ return a.year+"|"+a.quarter+"|"+a.company; }
function splitDates(raw){
  const s = String(raw||"").trim();
  if(!s || s==="-") return { start:null, end:null };
  const m = s.match(/(\d{4}-\d{2}-\d{2})\s*~\s*(\d{4}-\d{2}-\d{2})/);
  if(m) return { start:m[1], end:m[2] };
  const one = s.match(/(\d{4}-\d{2}-\d{2})/);
  return one ? { start:one[1], end:null } : { start:null, end:null };
}
function datesOf(d){ const f=fx(d), t=splitDates(d.date); return { start:f.recv||t.start, end:f.reply||t.end }; }
const dash = '<span class="td-none">—</span>';

/* ── 업체별 묶음 ─────────────────────────────────────────── */
function auditsOf(co){ return auditData.filter(a=>a.company===co); }
function issuesOf(co){
  return issueData.filter(d=>d.company===co).sort((a,b)=>{
    const av=datesOf(a).start||"", bv=datesOf(b).start||"";
    if(!av && !bv) return 0;
    if(!av) return 1;
    if(!bv) return -1;
    return av < bv ? -1 : (av > bv ? 1 : 0);
  });
}

/* ── 고르는 화면 ─────────────────────────────────────────── */
function renderPick(){
  const sel = document.getElementById("co-sel");
  const grid = document.getElementById("co-grid");
  COS.forEach(c=>{
    const o = document.createElement("option"); o.value=c; o.textContent=c; sel.appendChild(o);
  });
  grid.innerHTML = COS.map(c=>{
    const a = auditsOf(c).length, i = issuesOf(c).length;
    return '<button class="pick-card" data-co="'+esc(c)+'"><b>'+esc(c)+'</b>'
      + '<span>AUDIT <em>'+a+'</em>건 · 이슈 <em>'+i+'</em>건</span></button>';
  }).join("");
  grid.querySelectorAll("[data-co]").forEach(b=> b.addEventListener("click", ()=> show(b.dataset.co)));
  sel.addEventListener("change", e=>{ if(e.target.value) show(e.target.value); });
  document.getElementById("again").addEventListener("click", ()=>{
    document.getElementById("view").hidden = true;
    document.getElementById("pick").hidden = false;
    sel.value = "";
    location.hash = "";
    window.scrollTo(0,0);
  });
}

/* ── 고른 업체만 보여 준다 ───────────────────────────────── */
function show(co){
  document.getElementById("pick").hidden = true;
  document.getElementById("view").hidden = false;
  document.getElementById("co-sel").value = co;
  document.getElementById("sum-co").textContent = co;
  location.hash = encodeURIComponent(co);

  const A = auditsOf(co), I = issuesOf(co);
  const fault = I.filter(d=> fx(d).fault).length;
  const last = A.map(a=>String(a.date||"").slice(0,10)).filter(s=>/^\d{4}-/.test(s)).sort().pop();
  const lastI = I.map(d=>datesOf(d).start).filter(Boolean).sort().pop();

  document.getElementById("sum-kpis").innerHTML = [
    ["이슈 건수", I.length, "건", fault ? "제조사 귀책 "+fault+"건" : "제조사 귀책 없음"],
    ["AUDIT 점검", A.length, "회", last ? "최근 "+last : "점검 이력 없음"],
    ["최근 이슈 접수", lastI ? lastI : "—", "", lastI ? "" : "접수일자 미상"],
    ["이슈 유형", new Set(I.map(d=> (fx(d).type||d.type))).size, "종", "소분류 기준"],
  ].map(([lb,v,u,ft])=>
    '<div class="kpi"><div class="kpi-top"><span class="kpi-label">'+lb+'</span></div>'
    + '<div class="kpi-value">'+esc(String(v))+(u?'<sup>'+u+'</sup>':'')+'</div>'
    + '<div class="kpi-foot">'+esc(ft)+'</div></div>').join("");

  document.getElementById("sum-a-sub").textContent = A.length ? A.length+"회 점검" : "점검 이력 없음";
  document.getElementById("sum-i-sub").textContent = I.length ? I.length+"건" : "이슈 없음";
  renderAudit(A);
  renderIssue(I);
  window.scrollTo(0,0);
}

function renderAudit(A){
  const box = document.getElementById("sum-audit");
  if(!A.length){ box.innerHTML = '<div class="sum-empty">이 업체는 AUDIT 점검 이력이 없습니다.</div>'; return; }
  const rows = A.map(a=>{
    const k = aKey(a), s = auditSheet[k] || {}, st = auditStaff[k] || {};
    const sc = v => (v==null ? dash : '<b>'+Number(v).toFixed(2)+'</b>');
    return '<tr><td class="mono">'+esc(String(a.year))+'</td><td>'+esc(a.quarter)+'</td>'
      + '<td class="mono">'+esc(a.date||"-")+'</td>'
      + '<td class="num">'+sc(s.mfr)+'</td><td class="num">'+sc(s.dist)+'</td>'
      + '<td class="num">'+(a.capa==="있음"?'<span class="chip chip-good">있음</span>':'<span class="td-none">없음</span>')+'</td>'
      + '<td>'+esc([st.w,st.a].filter(Boolean).join(" / ")||"-")+'</td>'
      + '<td>'+esc(a.note||"-")+'</td></tr>';
  }).join("");

  /* 영역별 점수 — 가장 최근 점검 기준 */
  let cat = "";
  for(let i=A.length-1;i>=0;i--){
    const c = categoryScores[aKey(A[i])];
    if(c && c.m){
      cat = '<div class="sec-h" style="margin:18px 0 9px"><b style="font-size:13px">영역별 점수</b>'
        + '<i>'+esc(A[i].year+" "+A[i].quarter)+' · 제조업체 자체평가</i></div><div class="cat-grid">'
        + CAT_ORDER.filter(n=> c.m[n]!=null).map(n=>
            '<div class="cat-row"><span class="nm">'+esc(n)+'</span>'
            + '<span class="tr"><span class="fl" style="width:'+Math.max(3,c.m[n])+'%"></span></span>'
            + '<span class="vl">'+c.m[n]+'</span></div>').join("")
        + '</div>';
      break;
    }
  }
  box.innerHTML = '<div class="table-wrap"><table class="sum-tbl"><thead><tr>'
    + '<th>연도</th><th>차수</th><th>점검일</th><th style="text-align:center">제조</th>'
    + '<th style="text-align:center">유통</th><th style="text-align:center">CAPA</th>'
    + '<th>작성 / 승인</th><th>비고</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+cat;
}

function renderIssue(I){
  const box = document.getElementById("sum-issue");
  if(!I.length){ box.innerHTML = '<div class="sum-empty">이 업체는 등록된 품질 이슈가 없습니다.</div>'; return; }
  /* 유형 분포 — 이 업체 것만 */
  const cnt = {};
  I.forEach(d=>{ const t = fx(d).type || d.type; cnt[t] = (cnt[t]||0)+1; });
  const arr = Object.entries(cnt).sort((a,b)=>(SUB_ORDER[a[0]]??99)-(SUB_ORDER[b[0]]??99));
  const mx = Math.max.apply(null, arr.map(x=>x[1]));
  let last = null;
  const bars = arr.map(([n,v])=>{
    const mid = MID_OF[n] || "기타", slot = SLOT_OF[n] || "t8";
    const head = mid!==last
      ? '<div class="tx-mid" style="--tc:var(--'+(MID_SLOT[mid]||'t8')+')">'+esc(mid)
        + '<i>'+arr.filter(z=>(MID_OF[z[0]]||"기타")===mid).reduce((s,z)=>s+z[1],0)+'건</i></div>' : "";
    last = mid;
    return head + '<div class="rank-row type-row"><span class="name">'
      + '<span class="swatch" style="--tc:var(--'+slot+')"></span>'+esc(n)+'</span>'
      + '<div class="rank-track"><div class="rank-fill" style="width:'+Math.max(4,Math.round(v/mx*100))+'%; --tc:var(--'+slot+')"></div></div>'
      + '<span class="val">'+v+'</span></div>';
  }).join("");

  const rows = I.map((d,i)=>{
    const f = fx(d), dt = datesOf(d);
    const t = f.type || d.type, mid = f.mid || MID_OF[t] || "기타";
    return '<tr><td class="num mono">'+(i+1)+'</td>'
      + '<td class="num">'+(f.fault?'<span class="chip chip-serious">귀책</span>':'')+'</td>'
      + '<td class="num mono">'+(d.issueNo && d.issueNo!=="-" ? esc(d.issueNo) : dash)+'</td>'
      + '<td>'+esc(f.brand||"-")+'</td>'
      + '<td class="mono">'+esc(f.code||"-")+'</td>'
      + '<td>'+esc(f.product || d.title)+'</td>'
      + '<td class="mono">'+(dt.start?esc(dt.start):dash)+'</td>'
      + '<td class="mono">'+(dt.end?esc(dt.end):dash)+'</td>'
      + '<td><span class="mid-tag">'+esc(mid)+'</span> <span class="type-badge" style="background:var(--'+(SLOT_OF[t]||"t8")+'-tint);color:var(--'+(SLOT_OF[t]||"t8")+')">'+esc(t)+'</span></td>'
      + '<td>'+esc(f.claim || "")+'</td></tr>';
  }).join("");

  box.innerHTML = '<div class="rank-list" style="margin-bottom:18px">'+bars+'</div>'
    + '<div class="table-wrap"><table class="sum-tbl"><thead><tr>'
    + '<th style="text-align:center">순번</th><th style="text-align:center">귀책</th><th style="text-align:center">No.</th>'
    + '<th>브랜드</th><th>품번</th><th>제품명</th><th>접수일자</th><th>회신일자</th><th>클레임유형</th><th>클레임 내용</th>'
    + '</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

renderPick();
/* 주소에 업체가 적혀 있으면 바로 연다 */
(function(){
  const h = decodeURIComponent((location.hash||"").replace(/^#/,""));
  if(h && COS.indexOf(h) >= 0) show(h);
})();
</script>
