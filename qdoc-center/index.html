<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>품질문서 발행센터</title>
<style>
:root{--navy:#2b4a7e;--navy2:#1d2f52;--bg:#f3f5f8;--card:#fff;--ink:#1b2330;--ink2:#4a5463;--muted:#7a8494;--line:#dde3ea;
  --good:#2f7d4f;--warn:#9a5b00;--bad:#c0392b;--goodbg:#e7f3eb;--warnbg:#fdf1dc;--badbg:#fbe9e7;--sel:#eaf0f9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;font-size:13px}
header.top{background:var(--navy2);color:#fff;display:flex;align-items:center;gap:18px;padding:0 18px;height:52px;position:sticky;top:0;z-index:20}
.brand{white-space:nowrap}.brand b{font-size:16px;letter-spacing:.3px}.brand span{font-size:11.5px;opacity:.72;margin-left:8px}
nav.tabs{display:flex;gap:2px;height:100%}
nav.tabs button{background:none;border:0;color:#c3cfe3;font:inherit;font-size:13.5px;padding:0 13px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:#fff;border-bottom-color:#86b4ff;font-weight:700}
.top .right{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px}
.saved{opacity:.7;margin-right:6px;white-space:nowrap}
.btn{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 11px;font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#9fb2cc}.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn.sm{padding:2px 8px;font-size:12px}.btn.danger{color:var(--bad)}
main{padding:18px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer}
.kpi:hover{border-color:#9fb2cc}
.kpi .n{font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--ink2);margin-top:4px;font-weight:700}.kpi .s{color:var(--muted);font-size:11.5px;margin-top:3px}
.st{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:10px;white-space:nowrap}
.st.good{background:var(--goodbg);color:var(--good)}.st.warn{background:var(--warnbg);color:var(--warn)}.st.bad{background:var(--badbg);color:var(--bad)}.st.mute{background:#eef1f5;color:var(--ink2)}
table.list{width:100%;border-collapse:collapse}
table.list th,table.list td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.list th{font-size:12px;color:var(--ink2);font-weight:700;background:#f8fafc}
table.list tr.click{cursor:pointer}table.list tr.click:hover td{background:var(--sel)}
.lg{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;overflow:hidden}
.lgh{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none}
.lgh:hover{background:var(--sel)}
.lgh .ar{width:14px;color:var(--ink2);font-size:11px;transition:transform .15s}
.lg.open .lgh .ar{transform:rotate(90deg)}
.lgh .nm{font-weight:700;font-size:14px}
.lgh .sub{font-size:12px;color:var(--ink2)}
.lgh .cnt{margin-left:auto;font-size:12px;color:var(--ink2);white-space:nowrap}
.lgh .lgc{margin:0;width:16px;height:16px;flex:none;cursor:pointer}
.lgb{border-top:1px solid var(--line);padding:10px 14px 12px;background:#fbfcfe}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
.seg button{border:0;background:#fff;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--navy);color:#fff;font-weight:700}
.lgf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.split{display:grid;grid-template-columns:265px 1fr;gap:14px;align-items:start}
.side{position:sticky;top:66px;max-height:calc(100vh - 80px);overflow:auto}
.plist .it{padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.plist .it:hover{background:var(--sel)}.plist .it.on{background:var(--sel);border-color:#b9cbe6}
.plist .it .c{font-size:11.5px;color:var(--muted)}.plist .it .nm{font-weight:700;margin:1px 0 3px;line-height:1.3}
.secnav .s{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:12.5px}
.secnav .s:hover{background:var(--sel)}.secnav .s.on{background:var(--navy);color:#fff}
.dot{min-width:20px;height:18px;border-radius:9px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.dot.bad{background:var(--bad);color:#fff}.dot.warn{background:#f3c46a;color:#4d3200}.dot.good{background:var(--goodbg);color:var(--good)}
.form{display:grid;grid-template-columns:140px 1fr 140px 1fr;gap:6px 10px;align-items:center}
.form label{font-size:12px;color:var(--ink2);font-weight:700}
.form .w3{grid-column:span 3}
input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:54px;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:2px solid #9cc0ff;border-color:#6d9be0}
.inl{display:flex;gap:6px;align-items:center}
table.ed{width:100%;border-collapse:collapse;table-layout:fixed}
table.ed th{font-size:11.5px;background:#f1f5fa;color:var(--ink2);padding:5px;border:1px solid var(--line);text-align:center}
table.ed td{border:1px solid var(--line);padding:1px;vertical-align:top}
table.ed td input,table.ed td textarea,table.ed td select{border:0;border-radius:0;padding:4px 5px;min-height:0}
table.ed td textarea{min-height:30px}
table.ed td.no{text-align:center;color:var(--muted);font-size:11.5px;vertical-align:middle}
table.ed td.act{text-align:center;white-space:nowrap;vertical-align:middle}
table.ed td.act .btn{padding:1px 6px}
.edfoot{display:flex;gap:8px;align-items:center;margin-top:6px;color:var(--muted);font-size:11.5px}
.sub{font-weight:800;color:var(--navy);margin:18px 0 7px;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub:first-child{margin-top:0}
.hint{color:var(--muted);font-size:11.5px;font-weight:400}
.checks .row{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.checks .row:last-child{border:0}.checks .row .m{color:var(--muted)}
.checks .row a{color:var(--navy);cursor:pointer;text-decoration:underline}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .ttl{font-size:16px;font-weight:800;margin-right:auto;line-height:1.3}
.toolbar .ttl small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.empty{color:var(--muted);padding:22px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(15,23,40,.45);z-index:50;display:flex;align-items:center;justify-content:center}
.modal .box{background:#fff;border-radius:12px;padding:18px;width:min(520px,92vw)}
.modal .box h4{margin:0 0 10px}
.funcbox{background:#f5f8fd;border:1px solid #cfdcef;border-radius:8px;padding:9px 11px;margin-top:6px;font-size:12.5px;line-height:1.6}
.funcbox .fi{border-bottom:1px dashed #cfdcef;padding:4px 0}.funcbox .fi:last-child{border:0}
.sugwrap{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:#fff;border:1px solid #b9cbe6;border-radius:8px;box-shadow:0 8px 24px rgba(20,35,60,.16);max-height:320px;overflow:auto;z-index:40}
.sugg .si{padding:7px 10px;cursor:pointer;border-bottom:1px solid #eef2f7;font-size:12.5px}
.sugg .si:hover,.sugg .si.on{background:var(--sel)}
.sugg mark{background:#ffe48a;color:inherit;padding:0 1px;border-radius:2px}
.sugg .sh{position:sticky;top:0;background:#f1f5fa;color:var(--ink2);font-size:11px;font-weight:700;padding:4px 10px;border-bottom:1px solid #e2e8f0}
.sugg code{font-family:Consolas,monospace;background:#eef3fb;color:var(--navy);padding:0 5px;border-radius:4px;font-size:12px}
.pill{display:inline-block;background:#eef1f5;border-radius:10px;padding:0 7px;font-size:11.5px;color:var(--ink2);margin-left:4px}
.filt{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.filt input,.filt select{width:auto;min-width:200px}
#preview{position:fixed;inset:0;background:#dfe4ec;z-index:60;overflow:auto}
#preview .pbar{position:sticky;top:0;background:var(--navy2);color:#fff;padding:9px 16px;display:flex;gap:8px;align-items:center;z-index:2}
#preview .pbar b{margin-right:auto}
/* 알림 · 확인 창 */
.qn-layer{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.qn{display:flex;gap:10px;align-items:flex-start;background:var(--navy2);color:#fff;border-radius:9px;padding:10px 12px;box-shadow:0 8px 24px rgba(15,23,40,.28);font-size:12.5px;line-height:1.5}
.qn.bad{background:#7d231a}.qn.warn{background:#6b4300}.qn.good{background:#1f5a38}
.qn .qn-m{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.qn .qn-x{background:none;border:0;color:inherit;font-size:16px;line-height:1;cursor:pointer;opacity:.8;padding:0 2px}
.modal.qd{z-index:95}.modal.qd .box{display:flex;flex-direction:column}
.qd-msg{white-space:pre-wrap;line-height:1.6;font-size:13px}
.qd-bar{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn.pri.red{background:var(--bad);border-color:var(--bad)}
.btn:focus-visible,nav.tabs button:focus-visible{outline:2px solid #86b4ff;outline-offset:1px}
.cloudnote{background:#fdf1dc;color:#6b4300;border:1px solid #f0d49c;border-radius:8px;padding:8px 12px;margin:12px 18px 0;font-size:12.5px}
.cloudnote[hidden]{display:none}
@media (max-width:1180px){.brand span,.saved{display:none}header.top{gap:10px;height:auto;flex-wrap:wrap;row-gap:0;padding-top:6px}.top .right{margin-left:auto}nav.tabs{order:3;flex-basis:100%;flex-wrap:wrap;height:auto}nav.tabs button{padding:8px 10px 7px}.side{top:100px;max-height:calc(100vh - 116px)}}
@media (max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.split{grid-template-columns:1fr}.side{position:static;max-height:none}.form{grid-template-columns:110px 1fr}.form .w3{grid-column:auto}}

/* ===== 인쇄 문서 ===== */
.doc{font-family:"Malgun Gothic","맑은 고딕",sans-serif;color:#111;font-size:8.4pt}
.doc .page{width:210mm;height:297mm;margin:14px auto;background:#fff;padding:10mm 11mm 14mm;position:relative;box-shadow:0 1px 5px rgba(0,0,0,.2);overflow:hidden}
.doc table{width:100%;border-collapse:collapse;table-layout:fixed}
.doc td,.doc th{border:1px solid #7d8794;padding:2px 4px;vertical-align:middle;word-break:keep-all;overflow-wrap:anywhere;line-height:1.35}
.doc th{background:#dce8f5;font-weight:700;text-align:center}
.doc td.c{text-align:center}.doc .pre{white-space:pre-wrap}
.doc .bar{background:#2b4a7e;color:#fff;font-weight:700;padding:4px 7px;font-size:9.5pt;margin-top:9px;border:1px solid #2b4a7e}
.doc .bar.center{text-align:center}
.doc .ph td{border-color:#9aa3ae}.doc .ph .phl{text-align:center;font-weight:700;font-size:8pt}
.doc .ph .pht{text-align:center;font-weight:800;font-size:15pt;height:36px}.doc .ph .phs{text-align:center;font-size:7pt;color:#666;height:13px}
.doc .toc-title{text-align:center;font-size:22pt;font-weight:800;letter-spacing:8px;text-decoration:underline;text-underline-offset:7px;margin:16mm 0 12mm}
.doc .toc-t td,.doc .toc-t th{height:34px;font-size:10pt;padding:4px 10px}.doc .toc-t th{background:#fff;font-weight:600}
.doc .ph .phm{text-align:center;font-size:6.8pt;color:#333;height:12px;background:#f6f8fb}
.doc .ph .phn{text-align:center;font-size:12.5pt;font-weight:700;height:28px}.doc .ph .phe{text-align:center;font-size:8.5pt;color:#555;height:18px}
.doc .foot{position:absolute;left:11mm;right:11mm;bottom:6mm;display:flex;justify-content:space-between;font-size:7.5pt;color:#333}
.doc .note{font-size:7.6pt;color:#333;margin-top:3px}
.doc tbody.data td{height:19px}
.doc .h22 td,.doc .h22 th{height:22px}.doc .h26 td,.doc .h26 th{height:26px}.doc .h30 td,.doc .h30 th{height:30px}.doc .h34 td{height:34px}
.doc table.sign-ps th{height:24px}.doc table.sign-ps td{height:50px;font-size:9.5pt}
.doc .logo .l1{font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:25pt;letter-spacing:6px;line-height:1}
.doc .logo .l2{font-size:7.5pt;letter-spacing:4.5px;margin-top:2px}
.doc .cov-top{display:flex;align-items:center;justify-content:space-between;margin:2mm 0 4mm}
.doc .cov-title{text-align:center;font-size:21pt;font-weight:800;letter-spacing:6px;line-height:1.3;margin-right:10mm}
.doc .cov-title span{letter-spacing:0;font-size:17pt}
.doc .page.att{padding:9mm 9mm 12mm}
.doc .att .cap{font-size:8pt;color:#333;margin-bottom:3mm;display:flex;justify-content:space-between}
.doc .att img{display:block;width:100%;height:262mm;object-fit:contain;border:1px solid #ccd}
/* 성적서 */
.doc .coa{font-size:8.6pt}
.doc .coa .head{display:flex;align-items:center;margin-bottom:8px}
.doc .coa .title{flex:1;text-align:center;font-size:17pt;font-weight:800;letter-spacing:1px;padding-right:38mm}
.doc .coa td,.doc .coa th{text-align:center}
.doc .coa th{background:#f3f6fa}
.doc .coa .tests th{background:#dce8f5}
.doc .coa .box{border:1.6px solid #222}
.doc .coa .mt{margin-top:6px}
.doc .coa .info td,.doc .coa .info th{height:22px}
.doc .coa .tests td{height:20px}
.doc .coa.dense .tests td{height:var(--rh,17px);font-size:7.8pt;padding:1px 3px}
.doc .coa .left{text-align:left}
.doc .coa .sign td{height:42px}
.doc .coa .big{font-size:12pt;font-weight:800}
.doc .coa-ph{font-size:8.5pt;font-weight:700;border-bottom:1.5px solid #222;padding:0 0 3px;margin-bottom:6px}
.doc .page:not(.cont) > .coa-ph{display:none}
.doc .coa tbody.data td{height:var(--rh,20px)}
/* 인쇄·PDF 저장에서도 칸 색(머리 칸 하늘색·띠 남색)이 그대로 나오게 — 브라우저 「배경 그래픽」을 안 켜도 */
.doc,.doc *{-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
@media print{
  @page{size:A4;margin:0}
  body>*:not(#preview){display:none!important}
  html,body{background:#fff}
  #preview{position:static;overflow:visible;background:#fff}
  #preview .pbar{display:none}
  .doc .page{margin:0;box-shadow:none;break-after:page;page-break-after:always}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>품질문서 발행센터</b><span>제품표준서 · 완제품성적서</span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="right">
    <span class="saved" id="saved"></span>
    <button class="btn ghost sm" id="bkSave" title="모든 데이터를 JSON 파일로 저장">백업 저장</button>
    <button class="btn ghost sm" id="bkLoad" title="백업 JSON 불러오기">불러오기</button>
    <input type="file" id="bkFile" accept=".json" hidden>
  </div>
</header>
<div class="cloudnote" id="cloudNote" hidden></div>
<main id="main"></main>

<script src="js/platform.js?v=84642e3b"></script>
<script src="data/seed.js?v=f6e71bfc"></script>
<script src="data/makers.js?v=57fdab63"></script>
<script src="data/items.js?v=a2a00f03"></script>
<script src="data/funcdocs.js?v=728ca51a"></script>
<script src="data/rawreports.js?v=58bda395"></script>
<script>
'use strict';
/* ================= 기본 도구 ================= */
const LS = 'qdoc-center-v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
/* 시험방법에서 제조사 시험 코드 빼기 (사용자 요청): 「자사기준(관능시험법)-CMIS C-003」→「자사기준(관능시험법)」, 「자사 미생물시험법 : CMIS F- 002(1)」→「자사 미생물시험법」
   끝에 붙은 「- 또는 : + 영문 대문자 코드(숫자 포함)」만 뺌 — 「- HPLC」처럼 숫자 없는 것은 그대로 */
const cleanMethod = s => { const t = String(s ?? ''); const m = t.match(/\s*[-:：]\s*[A-Z][A-Z0-9]*(?:[\s-]+[A-Z0-9().]+)*\s*$/); return m && /\d/.test(m[0]) ? t.slice(0, m.index).trim() : t; };
/* 시험방법의 「자사」는 제조사 입장 표현 → 제조사 이름으로 (사용자 요청): 자사기준(관능시험법) → 코스맥스 기준(관능시험법), 자사 미생물시험법 → 코스맥스 미생물시험법 */
/* 화장품법 시행규칙 [별표 3] 화장품 유형 — 원료목록 보고 「유형표시」(예: 카8) 풀이 */
const TYPE3 = {
  가: ['영유아용 제품류', ['영유아용 샴푸, 린스', '영유아용 로션, 크림', '영유아용 오일', '영유아 인체 세정용 제품', '영유아 목욕용 제품']],
  나: ['목욕용 제품류', ['목욕용 오일·정제·캡슐', '목욕용 소금류', '버블 배스', '그 밖의 목욕용 제품류']],
  다: ['인체 세정용 제품류', ['폼 클렌저', '바디 클렌저', '액체 비누 및 화장 비누', '외음부 세정제', '물휴지', '그 밖의 인체 세정용 제품류']],

function tedit(rows, cols, { newRow, numbered = true, onchange, addLabel = '+ 행 추가' } = {}) {
  const wrap = document.createElement('div');
  const blank = () => newRow ? newRow() : Object.fromEntries(cols.map(c => [c.k, '']));
  function render() {
    const colg = (numbered ? '<col style="width:34px">' : '') + cols.map(c => `<col style="width:${c.w || 'auto'}">`).join('') + '<col style="width:64px">';
    wrap.innerHTML = `<table class="ed"><colgroup>${colg}</colgroup><thead><tr>${numbered ? '<th>No</th>' : ''}${cols.map(c => `<th>${c.label}</th>`).join('')}<th></th></tr></thead><tbody></tbody></table>
      <div class="edfoot"><button class="btn sm">${addLabel}</button><span>엑셀에서 여러 칸을 복사해 칸에 붙여넣으면 여러 행이 한 번에 들어갑니다.</span></div>`;
    const tb = wrap.querySelector('tbody');
    rows.forEach((r, i) => {
      const tr = document.createElement('tr');
      if (numbered) tr.appendChild(el(`<td class="no">${i + 1}</td>`));
      cols.forEach((c, ci) => {
        const td = document.createElement('td'); let e;
        if (c.opts) { e = document.createElement('select'); e.innerHTML = c.opts.map(o => `<option value="${esc(o)}">${esc(o || '—')}</option>`).join(''); e.value = r[c.k] ?? ''; }
        else if (c.ta) { e = document.createElement('textarea'); e.rows = c.ta; e.value = r[c.k] ?? ''; }
        else { e = document.createElement('input'); e.value = r[c.k] ?? ''; if (c.calc) e.placeholder = c.calc(r) || ''; if (c.type) e.type = c.type; }
        e.addEventListener(c.opts ? 'change' : 'input', () => { r[c.k] = e.value; changed(); onchange && onchange(r, c.k, e, tr); });
        e.addEventListener('paste', ev => {
          const t = (ev.clipboardData || window.clipboardData).getData('text/plain');
          if (!/[\t\n]/.test(t.replace(/\r?\n$/, ''))) return;
          ev.preventDefault(); pasteGrid(t, i, ci);
        });
        td.appendChild(e); tr.appendChild(td);
      });
      const act = el('<td class="act"><button class="btn sm" title="위로">↑</button> <button class="btn sm danger" title="삭제">✕</button></td>');
      act.children[0].onclick = () => { if (i > 0) { [rows[i - 1], rows[i]] = [rows[i], rows[i - 1]]; changed(); render(); } };
      act.children[1].onclick = () => { rows.splice(i, 1); changed(); render(); };
      tr.appendChild(act); tb.appendChild(tr);
    });
    wrap.querySelector('.edfoot .btn').onclick = () => { rows.push(blank()); changed(); render(); tb.lastElementChild?.querySelector('input,textarea,select')?.focus(); };
  }
  function pasteGrid(t, r0, c0) {
    const lines = t.replace(/\r/g, '').replace(/\n$/, '').split('\n').map(l => l.split('\t'));
    lines.forEach((cells, i) => { const ri = r0 + i; if (!rows[ri]) rows.push(blank()); cells.forEach((v, j) => { const c = cols[c0 + j]; if (c) rows[ri][c.k] = v.trim(); }); });
    changed(); render();
  }
  render(); wrap.rerender = render; return wrap;
}

async function uploadPages(p) {
  const out = [];

    let pages = null;
    try { const r = await window.IDB?.get(u.fileId); if (r && r.pages && r.pages.length) pages = r.pages; } catch (e) { }
    // 이 브라우저에 원본이 없으면 공동 저장소에 올라간 쪽 그림으로
    if (!pages && Cloud.art && (u.pageAssets || []).length) pages = u.pageAssets.map(id => '/_blob/' + id);
    if (pages) out.push({ kind: u.kind, comp: u.comp, name: u.name, pages });
  }
  return out;
}

   <tbody class="data">${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.item)}</td>${multi ? `<td>${esc(r.sub)}</td>` : ''}<td>${esc(r.criterion)}</td><td>${esc(r.result)}</td><td style="font-size:7.2pt">${nl(r.remark || '')}</td></tr>`).join('')}${Array(padN).fill('<tr class="pad">' + '<td></td>'.repeat(cols.length) + '</tr>').join('')}</tbody></table>`)}
  ${B(`<table class="box mt"><colgroup><col style="width:13%"><col></colgroup><tr><th style="height:44px">특이사항</th><td class="left">${nl(c.remarks)}</td></tr></table>`)}
  ${B(`<table class="sign box mt"><colgroup><col style="width:33.3%"><col style="width:33.3%"><col></colgroup>
   <tr><th>작 성</th><th>검 토</th><th>승 인<br><span style="font-weight:400;font-size:7pt">(품질관리 책임자)</span></th></tr>
   <tr><td>${esc(c.sign.writer)}</td><td>${esc(c.sign.reviewer)}</td><td>${esc(c.sign.approver)}</td></tr></table>`)}
  </div><div class="foot"><span>완제품시험성적서</span><span class="pn"></span><span>올리브인터내셔널(주)</span></div></section>`;
}

/* ================= 미리보기 · 쪽 나누기 ================= */
function makeCont(pg) {
  const c = document.createElement('section'); c.className = 'page cont'; c.dataset.key = pg.dataset.key + 'c';
  const ph = pg.querySelector(':scope > .ph'); if (ph) c.appendChild(ph.cloneNode(true));
  const b = document.createElement('div'); b.className = pg.querySelector(':scope > .body')?.className || 'body'; c.appendChild(b);
  const f = pg.querySelector(':scope > .foot'); if (f) c.appendChild(f.cloneNode(true));
  return c;
}
function cloneBlk(b) {
  const c = b.cloneNode(true);
  [...c.children].forEach(x => { if (!x.classList.contains('bar') && !x.matches('table.dsplit')) x.remove(); });
  const bar = c.querySelector('.bar'); if (bar && !/\(계속\)$/.test(bar.textContent)) bar.textContent += ' (계속)';
  const tb = c.querySelector('tbody.data'); if (tb) tb.innerHTML = '';
  return c;
}
const over = pg => pg.scrollHeight > pg.clientHeight + 2;
function paginate(root) {
  const pages = [...root.querySelectorAll('.page')];
  for (let i = 0; i < pages.length; i++) {
    const pg = pages[i]; if (pg.classList.contains('nosplit')) continue;
    let g = 0;
    while (over(pg) && g++ < 1500) {
      const body = pg.querySelector(':scope > .body'); if (!body) break;
      const pads = body.querySelectorAll('tr.pad'); if (pads.length) { pads[pads.length - 1].remove(); continue; }
      const blks = [...body.children], last = blks[blks.length - 1]; if (!last) break;
      let cont = pg.nextElementSibling;
      if (!cont || cont.dataset.key !== pg.dataset.key + 'c') { cont = makeCont(pg); pg.after(cont); pages.splice(i + 1, 0, cont); }
      const cb = cont.querySelector(':scope > .body');
      const tb = last.querySelector('table.dsplit tbody.data'), rows = tb ? [...tb.rows] : [];
      let first = cb.firstElementChild;
      const same = first && first.dataset.id && first.dataset.id === last.dataset.id && first.querySelector('tbody.data');
      if (tb && rows.length <= 3 && blks.length > 1) {
        // 표 머리만 남는 것을 막기 위해 블록째 다음 쪽으로
        if (same) { const ft = first.querySelector('tbody.data'); [...rows].reverse().forEach(r => ft.prepend(r)); const ob = last.querySelector('.bar'), fb = first.querySelector('.bar'); if (ob && fb) fb.textContent = ob.textContent; last.remove(); }
        else cb.prepend(last);
      } else if (tb && rows.length > 1) {
        if (!same) { first = cloneBlk(last); last.querySelectorAll(':scope > .note').forEach(n => first.appendChild(n)); cb.prepend(first); }
        first.querySelector('tbody.data').prepend(rows[rows.length - 1]);
      } else if (blks.length > 1) cb.prepend(last);
      else break;
    }
  }
}
function number(root) { const pgs = [...root.querySelectorAll('.page')]; pgs.forEach((pg, i) => { const pn = pg.querySelector('.pn'); if (pn) pn.textContent = `${i + 1} / ${pgs.length}`; }); return pgs.length; }
function preview(title, html, onIssue) {
  $('#preview')?.remove();
  const ART = Cloud.art;
  const ov = el(`<div id="preview"><div class="pbar"><b>${esc(title)}</b><span class="hint" id="pvInfo" style="color:#c3cfe3"></span>${ART
    ? '<button class="btn" id="pvPrint" title="쪽마다 그림으로 만든 PDF를 받습니다">발행 (PDF 받기)</button><button class="btn ghost" id="pvHtml" title="글자를 고를 수 있는 원본 화질: 받은 파일을 열고 Ctrl+P → PDF로 저장">HTML 받기</button>'
    : '<button class="btn" id="pvPrint">발행 (인쇄 / PDF 저장)</button><button class="btn ghost" id="pvHtml" title="쪽 나눔이 끝난 문서를 HTML 한 파일로 저장">HTML 저장</button>'}<button class="btn ghost" id="pvClose">닫기</button></div><div class="doc" id="doc">${html}</div></div>`);
  document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  const run = () => { paginate($('#doc')); const n = number($('#doc')); $('#pvInfo').textContent = ART ? `${n}쪽` : `${n}쪽 · 인쇄 창에서 '대상: PDF로 저장'을 고르면 PDF가 됩니다`; };
  // 그림이 다 그려진 뒤 쪽 나누기 (창이 가려져 있어도 돌도록 setTimeout, 3초 안전장치)
  let ran = false; const once = () => { if (ran) return; ran = true; setTimeout(run, 30); };
  const imgs = [...ov.querySelectorAll('img')]; Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))).then(once);
  setTimeout(once, 3000);
  $('#pvClose').onclick = () => { ov.remove(); document.body.style.overflow = ''; };
  $('#pvPrint').onclick = async () => {
    if (!ART) { onIssue && onIssue(); window.print(); return; }
    const b = $('#pvPrint'); if (b.disabled) return; b.disabled = true; const info = $('#pvInfo'), keep = info.textContent;
    try { const ok = await pagesToPdf([...$('#doc').querySelectorAll('.page')], docFileName(title, 'pdf'), (i, n) => { info.textContent = `PDF 만드는 중 ${i} / ${n}쪽`; }); if (ok) { onIssue && onIssue(); notify('PDF를 받았습니다. 발행 이력에 남겼습니다.', 'good'); } }
    catch (e) { console.error(e); notify('PDF를 만들지 못했습니다: ' + e.message + '\n「HTML 받기」로 받아 Ctrl+P로 PDF 저장해 주세요.', 'bad', 9000); }
    finally { b.disabled = false; info.textContent = keep; }
  };
  $('#pvHtml').onclick = () => exportDoc(title);
}
const docFileName = (title, ext) => (title.split(' — ')[0] + ' ' + (title.split(' — ')[1] || '')).replace(/\s*\(.*\)\s*$/, '').replace(/[\\/:*?"<>|]/g, '_').trim() + '.' + ext;
async function exportDoc(title) {
  const css = [...document.querySelectorAll('style')].map(s => s.textContent).join('\n');
  const box = document.createElement('div'); box.innerHTML = $('#doc').innerHTML;
  if (Cloud.art) await inlineImages(box);
  const html = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${esc(title)}</title><style>${css}\n#preview{position:static;overflow:visible}</style></head><body><div id="preview"><div class="doc">${box.innerHTML}</div></div></body></html>`;
  const name = docFileName(title, 'html');
  if (!Cloud.art && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    try { const r = await fetch('save?name=' + encodeURIComponent(name), { method: 'POST', body: html }); if (r.ok) { notify(`내보내기 폴더에 저장했습니다: ${name}`, 'good'); return; } } catch (e) { }
  }
  if (await saveFile(name, html, 'text/html') && Cloud.art) notify('받은 HTML을 브라우저로 열고 Ctrl+P → 「PDF로 저장」을 고르면 원본 화질 PDF가 됩니다.', 'info', 9000);
}
/* 빈 작성 양식: 지금 양식 그대로 빈칸으로 (저장·발행 이력 남기지 않음) */
function blankProduct() {
  const p = newProduct(); fixProduct(p);
  Object.assign(p, { psNo: '', nameKo: '', nameEn: '', date: '' });
  (p.revisions || []).forEach(r => { r.date = ''; r.effDate = ''; });
  (p.components || []).forEach(c => { c.functional = '예'; c.fullName = ''; }); // 기능성 칸까지 보이게
  return p;
}
function previewBlankPS() { preview('제품표준서 작성 양식 — 빈 양식', psDoc(blankProduct(), []), null); }
function previewBlankCoa() {
  const c = newCoa(blankProduct());
  Object.assign(c, { productId: '', testNo: '', receiptDate: '', requestDate: '', createdAt: '', psRef: { no: '', rev: '' } });
  preview('완제품시험성적서 작성 양식 — 빈 양식', coaDoc(c), null);
}
async function previewPS(p) {
  const req = psChecks(p).filter(x => x.lvl === '필수' && !x.ok).length;
  const extra = await uploadPages(p);
  preview(`제품표준서 ${p.psNo} Rev.${p.rev} — ${p.nameKo}${req ? ` (CGMP 필수 ${req}건 미충족)` : ''}`, psDoc(p, extra), () => logIssue({ type: '제품표준서', pid: p.id, docNo: p.psNo, product: p.nameKo, ref: 'Rev.' + p.rev, state: req ? `필수 ${req}건 미충족 상태로 발행` : 'CGMP 필수 충족', snap: snap(p) }));
}
function previewCoa(c) {
  const p = prod(c.productId), s = coaStatus(c);
  preview(`완제품시험성적서 ${c.testNo} — ${p?.nameKo || ''} (${s[0]})`, coaDoc(c), () => logIssue({ type: '완제품성적서', pid: c.productId, cid: c.id, docNo: c.testNo, product: p?.nameKo || '', ref: c.lots.map(l => l.lot).join(', '), state: s[0], snap: snap(c), psnap: p ? { nameKo: p.nameKo, nameSub: p.nameSub || '', code: p.code, psNo: p.psNo, rev: p.rev } : null }));
}

/* ================= 백업 ================= */
$('#bkSave').onclick = () => saveFile(`품질문서발행센터_백업_${today()}.json`, JSON.stringify(S, null, 1), 'application/json');
$('#bkLoad').onclick = () => $('#bkFile').click();
$('#bkFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let d; try { d = JSON.parse(await f.text()); if (!d.products) throw new Error('발행센터 백업 파일이 아닙니다'); } catch (er) { notify('불러오기 실패: ' + er.message, 'bad'); return; }
  const msg = `백업(제품 ${d.products.length}개, 성적서 ${(d.coas || []).length}건)으로 지금 데이터(제품 ${S.products.length}개, 성적서 ${S.coas.length}건)를 덮어씁니다.` + (Cloud.shared() ? '\n공동 저장소 전체가 바뀌어 다른 사람이 만든 문서도 백업에 없으면 사라집니다.' : '');
  if (!await askConfirm(msg, { ok: '덮어쓰기', danger: true })) return;
  const ingest = S.ingest; S = d; if (Cloud.art) S.ingest = d.ingest || ingest;
  S.products.forEach(fixProduct); S.coas = S.coas || []; S.coas.forEach(fixCoa); S.issues = S.issues || []; migratePsNo(); save(); go('log');
};

S = load();
migratePsNo(); fixRevStart(); fixEnactDates();

render();
