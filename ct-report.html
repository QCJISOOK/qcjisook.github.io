<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>CT 성적서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 시험 성적서 철 — 머리 표(문서 정보) → 판정 도장 요약 → 탭(결과서 · 조건부↔불량 · 품목 · 연결표) */
:root{
  --paper:#f3f5f2; --sheet:#ffffff; --ink:#1b2220; --ink-2:#4d5853; --ink-3:#7a8580;
  --rule:#d8ddd8; --rule-2:#e8ece8; --accent:#22557a; --accent-soft:#e3edf4;
  --pass:#2d7a4b; --pass-soft:#e4f1e8; --cond:#a8690f; --cond-soft:#fbefd9;
  --fail:#b0352c; --fail-soft:#f8e1de; --wait:#5d6d7e; --wait-soft:#e7ebf0;
  --note:#6b5aa6; --note-soft:#ece8f6;
  --f-display:"Hahmlet","Noto Serif KR","Batang",serif;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111514; --sheet:#181d1c; --ink:#e5ebe8; --ink-2:#a9b4af; --ink-3:#7d8984;
  --rule:#2d3634; --rule-2:#232b29; --accent:#86b8dd; --accent-soft:#1d2e3b;
  --pass:#63c08a; --pass-soft:#17291f; --cond:#e3ad4f; --cond-soft:#30260f;
  --fail:#ef7468; --fail-soft:#351a17; --wait:#9fb0c2; --wait-soft:#1f262e;
  --note:#b3a5ea; --note-soft:#26213a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111514; --sheet:#181d1c; --ink:#e5ebe8; --ink-2:#a9b4af; --ink-3:#7d8984;
  --rule:#2d3634; --rule-2:#232b29; --accent:#86b8dd; --accent-soft:#1d2e3b;
  --pass:#63c08a; --pass-soft:#17291f; --cond:#e3ad4f; --cond-soft:#30260f;
  --fail:#ef7468; --fail-soft:#351a17; --wait:#9fb0c2; --wait-soft:#1f262e;
  --note:#b3a5ea; --note-soft:#26213a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 머리 표 */
.head{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);display:grid;grid-template-columns:1fr auto;overflow:hidden}
.head-main{padding:18px 22px;display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--ink-3)}
.head h1{font-size:34px;line-height:1.15}
.head-sub{color:var(--ink-2);max-width:68ch}
.head-meta{border-left:1px solid var(--rule);display:grid;grid-template-columns:auto auto;font-size:12.5px;min-width:0}
.head-meta div{padding:7px 14px;border-bottom:1px solid var(--rule-2)}
.head-meta div:nth-child(odd){color:var(--ink-3);background:var(--rule-2);white-space:nowrap}
.head-meta div:nth-last-child(-n+2){border-bottom:0}
@media (max-width:760px){.head{grid-template-columns:1fr}.head-meta{border-left:0;border-top:1px solid var(--rule)}}

/* 판정 도장 */
.stamp{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border:1.5px solid currentColor;border-radius:4px;
  font-weight:600;font-size:12px;line-height:1.6;white-space:nowrap;background:var(--sheet)}
.s-pass{color:var(--pass);background:var(--pass-soft)} .s-cond{color:var(--cond);background:var(--cond-soft)}
.s-fail{color:var(--fail);background:var(--fail-soft)} .s-wait{color:var(--wait);background:var(--wait-soft)}
.s-note{color:var(--note);background:var(--note-soft)} .s-na{color:var(--ink-3);border-style:dashed;background:transparent}
.stamp.big{font-size:14px;padding:3px 12px;transform:rotate(-2deg);border-width:2px;box-shadow:inset 0 0 0 2px var(--sheet),inset 0 0 0 3px currentColor}

/* 요약 */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.6fr);gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.tile .v{font-family:var(--f-display);font-size:30px;line-height:1.1}
.tile .d{font-size:12px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.tile.wide{border-color:var(--accent);background:linear-gradient(0deg,var(--sheet),var(--sheet))}
.tile.wide .v{font-size:22px}
@media (max-width:900px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.tile.wide{grid-column:1/-1}}

/* 탭 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.tab{border:1px solid transparent;border-bottom:0;background:none;padding:9px 14px;border-radius:var(--r) var(--r) 0 0;cursor:pointer;color:var(--ink-2);font-weight:500;margin-bottom:-1px}
.tab[aria-selected="true"]{background:var(--sheet);border-color:var(--rule);color:var(--ink);font-weight:600}
.tab .c{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);margin-left:4px}
.panel{display:flex;flex-direction:column;gap:14px}
.note{font-size:12.5px;color:var(--ink-2);max-width:90ch}

/* 표 */
.tbl-wrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;color:var(--ink-3);font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--rule-2)}
td{padding:9px 10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--accent-soft)}
tr.row[aria-expanded="true"] td{background:var(--accent-soft);border-bottom-color:transparent}
.pname{font-weight:600}
.small{font-size:12px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11.5px;padding:0 7px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap;background:var(--sheet)}
.chip.warn{border-color:var(--cond);color:var(--cond)}
.chip.cond{border-color:var(--cond);color:var(--cond);background:var(--cond-soft)}
.chip.fail{border-color:var(--fail);color:var(--fail);background:var(--fail-soft)}
.chip.note{border-color:var(--note);color:var(--note);background:var(--note-soft)}
.cnt{font-family:var(--f-display);font-size:18px}
.codes-in{display:flex;flex-wrap:wrap;gap:3px;align-items:center;max-width:190px;margin-bottom:3px}
.orig{display:flex;flex-direction:column;gap:8px}
.orig-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.orig-top .small{min-width:0;overflow-wrap:anywhere}
.btn{display:inline-block;border:1px solid var(--accent);color:var(--accent);background:var(--sheet);border-radius:var(--r);padding:4px 12px;font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{border:1px solid var(--rule);border-radius:4px;background:var(--sheet);padding:4px;cursor:zoom-in;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--ink-3)}
.thumb img{width:120px;height:170px;object-fit:cover;object-position:top;background:#fff;border-radius:2px;display:block}
.thumb:hover{border-color:var(--accent)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,14,13,.84);overflow:auto;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:min(1000px,100%);height:auto;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.lb-x{position:sticky;top:0;align-self:flex-end;border:0;border-radius:var(--r);padding:6px 14px;background:var(--sheet);color:var(--ink);font-weight:600;cursor:pointer}
#p-list td.nw{white-space:nowrap}
#p-list td.c-code{min-width:150px}
#p-list td.c-prod{min-width:180px}
#p-list td.c-org{min-width:88px}
#p-list td.c-cond{min-width:170px}
#p-list td.c-ret{min-width:180px}
.cnt.zero{color:var(--ink-3)}

/* 펼친 상세 */
.detail td{padding:0;background:var(--sheet)}
.det{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;padding:16px 16px 20px;border-top:2px solid var(--accent)}
@media (max-width:900px){.det{grid-template-columns:1fr}}
.det h3{font-size:15px;margin-bottom:8px}
.det section{display:flex;flex-direction:column;gap:8px;min-width:0}
.items td,.items th{padding:5px 8px;font-size:12.5px}
.items tr.flag td{background:var(--cond-soft)}
.items tr.flag-f td{background:var(--fail-soft)}
.items .grp{color:var(--ink-3);font-size:11.5px;white-space:nowrap}
ol.op{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px;color:var(--ink-2);font-size:13px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-size:12.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0}
.box{border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;background:var(--paper)}
.box.warn{border-color:var(--cond);background:var(--cond-soft)}
.codes{display:flex;flex-wrap:wrap;gap:4px;max-height:150px;overflow:auto}
.code{font-family:var(--f-mono);font-size:11.5px;padding:0 6px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);white-space:nowrap}

/* 막대 */
.bars{display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:minmax(80px,140px) 1fr 34px;gap:8px;align-items:center;font-size:12.5px}
.bar .t{height:12px;background:var(--rule-2);border-radius:3px;overflow:hidden;display:flex}
.bar .f{height:100%;background:var(--accent)}
.bar .f.lk{background:var(--cond)}
.bar .n{text-align:right;font-family:var(--f-mono)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* 조건부↔불량 카드 */
.finds{display:flex;flex-direction:column;gap:10px}
.find{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.1fr);overflow:hidden}
.find>div{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.find>div+div{border-left:1px solid var(--rule-2)}
.find .lab{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
.find.cond{border-left:4px solid var(--cond)} .find.fail{border-left:4px solid var(--fail)} .find.note{border-left:4px solid var(--note)}
.find .big{font-family:var(--f-display);font-size:26px;line-height:1}
.find ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}
@media (max-width:900px){.find{grid-template-columns:1fr}.find>div+div{border-left:0;border-top:1px solid var(--rule-2)}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar label{font-size:12.5px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
input[type=search],select{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:6px 10px;min-width:0}
input[type=search]{width:min(320px,100%)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;color:var(--ink-2);font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--sheet)}
.more{align-self:center;border:1px solid var(--rule);background:var(--sheet);padding:6px 14px;border-radius:var(--r);cursor:pointer}

/* 제품별 연결 비교 */
.prod{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px}
@media (max-width:900px){.prod{grid-template-columns:1fr}}
.split{height:16px;display:flex;border-radius:3px;overflow:hidden;background:var(--rule-2)}
.split .a{background:var(--cond)} .split .b{background:var(--ink-3)}
.mode{font-family:var(--f-body);font-size:14px;vertical-align:middle;margin-left:8px;color:var(--note);background:var(--note-soft);transform:rotate(-3deg)}
.notice{border:1.5px dashed var(--note);background:var(--note-soft);border-radius:var(--r);padding:10px 14px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.notice b{color:var(--note)}
.rv{font-size:11.5px;padding:0 7px;border-radius:999px;border:1px dashed var(--ink-3);color:var(--ink-3);white-space:nowrap}
.rv.done{border:1px solid var(--pass);color:var(--pass);background:var(--pass-soft)}
footer{font-size:12px;color:var(--ink-3);border-top:1px solid var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:no-preference){tr.row td{transition:background .12s}}
</style>

<div class="wrap">
  <header class="head">
    <div class="head-main">
      <div class="eyebrow">품질관리팀 · 상용성(Compatibility Test) 결과서 취합</div>
      <h1>CT 성적서<span id="mode"></span></h1>
      <div class="head-sub">상용성 시험 결과서를 모아 ERP 품목과 맞추고, 조건부 적합·부적합으로 지적된 항목이 실제 반품 불량 어떤 유형으로 이어졌는지 함께 봅니다.</div>
    </div>
    <div class="head-meta" id="meta"></div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="summary" id="summary"></div>

  <nav class="tabs" role="tablist" id="tabs"></nav>

  <section class="panel" id="p-list" role="tabpanel"></section>
  <section class="panel" id="p-findings" role="tabpanel" hidden></section>
  <section class="panel" id="p-items" role="tabpanel" hidden></section>
  <section class="panel" id="p-map" role="tabpanel" hidden></section>

  <footer id="foot"></footer>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="결과서 원본 크게 보기">
  <button type="button" class="lb-x" id="lb-x">닫기 ✕</button>
  <img id="lb-img" alt="">

  if (!TABS.some(t => t[0] === id)) id = "list";

/* ── 결과서 목록 ── */
function bars(obj, linkedSet, total){
  const ent = Object.entries(obj); if (!ent.length) return `<div class="small">해당 품번의 반품 불량 기록이 없습니다.</div>`;
  const max = Math.max(...ent.map(e => e[1]));
  return `<div class="bars">${ent.map(([k,v]) => `<div class="bar"><span>${esc(k||"(빈칸)")}</span><span class="t"><span class="f${linkedSet && linkedSet.has(k) ? " lk" : ""}" style="width:${(v/max*100).toFixed(1)}%"></span></span><span class="n">${v}</span></div>`).join("")}</div>`;
}

(function renderList(){

/* ── 조건부·부적합 ↔ 불량 ── */

      <button type="button" id="f-all" aria-pressed="${showNotes}">특이사항(주의·참고)까지 ${all.length}</button></div>
      <span class="note">연결은 「연결표」 탭의 분류 → 불량 소분류로 맞춥니다. 실제 불량은 불량률 대시보드의 반품메모(중분류·소분류·증상)에서 왔습니다.</span></div>
    <div class="finds">${list.map(card).join("")}</div>
    <h2 style="font-size:18px;margin-top:8px">제품별 — 실제 불량 중 CT가 미리 짚은 몫</h2>
    <div class="legend"><span><i class="dot" style="background:var(--cond)"></i>CT 지적과 같은 유형</span><span><i class="dot" style="background:var(--ink-3)"></i>CT가 짚지 않은 유형</span></div>
    <div class="finds">${prods || '<div class="small">매칭된 품번의 반품 불량이 없습니다.</div>'}</div>`;
  $("#f-formal").onclick = () => { showNotes = false; renderFindings(); };
  $("#f-all").onclick = () => { showNotes = true; renderFindings(); };
}
renderFindings();

/* ── 품목 매칭 ── */
const IT = DATA.품목; // [품번,품명,브랜드,대분류,중분류,자산분류,구매처,상태,등록일,CT]
let itLimit = 200, itBuilt = false;
function renderItems(){
  if (!itBuilt){
    itBuilt = true;
    const opt = (i) => [...new Set(IT.map(x => x[i]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ko"));
    $("#p-items").innerHTML = `
      <div class="toolbar">
        <input type="search" id="it-q" placeholder="품번·품명·구매처 검색" aria-label="품목 검색">
        <label>브랜드 <select id="it-b"><option value="">전체</option>${opt(2).map(v=>`<option>${esc(v)}</option>`).join("")}</select></label>
        <label>대분류 <select id="it-c"><option value="">전체</option>${opt(3).map(v=>`<option>${esc(v)}</option>`).join("")}</select></label>
        <div class="seg" role="group" aria-label="CT 여부"><button type="button" data-ct="" aria-pressed="true">전체</button><button type="button" data-ct="y" aria-pressed="false">CT 있음</button><button type="button" data-ct="n" aria-pressed="false">CT 없음(화장품 제품)</button></div>
      </div>
      <p class="note" id="it-note"></p>
      <div class="tbl-wrap"><table><thead><tr><th>품번</th><th>품명</th><th>브랜드</th><th>대·중분류</th><th>자산분류</th><th>구매처(제조사)</th><th>상태</th><th>등록일</th><th>CT</th></tr></thead><tbody id="it-body"></tbody></table></div>
      <button type="button" class="more" id="it-more" hidden>200개 더 보기</button>`;
    ["it-q","it-b","it-c"].forEach(id => $("#"+id).addEventListener("input", () => { itLimit = 200; drawItems(); }));
    $("#p-items").querySelector(".seg").addEventListener("click", e => { const b = e.target.closest("[data-ct]"); if (!b) return;
      $("#p-items").querySelectorAll("[data-ct]").forEach(x => x.setAttribute("aria-pressed", x === b)); itLimit = 200; drawItems(); });
    $("#it-more").onclick = () => { itLimit += 200; drawItems(); };
  }
  drawItems();
}
function drawItems(){
  const q = $("#it-q").value.trim().toLowerCase().replace(/\s+/g,""), b = $("#it-b").value, c = $("#it-c").value;
  const ct = $("#p-items").querySelector('[data-ct][aria-pressed="true"]').dataset.ct;
  const rows = IT.filter(x => (!b || x[2] === b) && (!c || x[3] === c)
    && (!ct || (ct === "y" ? x[9] : (!x[9] && /화장품/.test(x[3]) && x[5] === "제품")))
    && (!q || (x[0]+x[1]+x[6]).toLowerCase().replace(/\s+/g,"").includes(q)));
  $("#it-note").innerHTML = `ERP 품목 ${fmt(IT.length)}개 중 <b class="num">${fmt(rows.length)}</b>개 · CT 결과서와 맞춘 품번 ${fmt(IT.filter(x=>x[9]).length)}개. 「CT 없음」은 품목대분류가 기초·색조화장품이고 자산분류가 「제품」인데 맞춘 CT 결과서가 없는 품번입니다.`;
  $("#it-body").innerHTML = rows.slice(0, itLimit).map(x => `<tr><td class="mono">${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td class="small">${esc(x[3])}${x[4] ? " · "+esc(x[4]) : ""}</td><td class="small">${esc(x[5])}</td><td>${esc(x[6])}</td><td class="small">${esc(x[7])}</td><td class="mono small">${esc(x[8])}</td><td>${x[9] ? x[9].split(",").map(id => `<span class="chip cond">${esc(id)}</span>`).join(" ") : ""}</td></tr>`).join("");
  $("#it-more").hidden = rows.length <= itLimit;
}

/* ── 연결표 ── */
(function renderMap(){
  const M = DATA.연결표;
  const use = {}; R.forEach(r => r.지적.forEach(f => f.분류.forEach(k => use[k] = (use[k]||0)+1)));
  $("#p-map").innerHTML = `<p class="note">CT 결과서의 지적을 아래 분류로 나누고, 각 분류가 불량률 대시보드의 어떤 소분류(반품 불량유형)로 나타나는지 정한 표입니다. 바꾸려면 <span class="mono">_data\\ct_defect_map.json</span>을 고치고 갱신.bat을 다시 실행합니다.</p>
  <div class="tbl-wrap"><table><thead><tr><th>CT 지적 분류</th><th>어떤 시험 항목인가</th><th>연결하는 불량 소분류</th><th>쓰인 지적</th></tr></thead><tbody>
  ${Object.entries(M).map(([k,v]) => `<tr><td class="pname">${esc(k)}</td><td class="small">${esc(v.설명)}</td><td><div class="chips">${v.소분류.map(s=>`<span class="chip">${esc(s)}</span>`).join("")}</div></td><td class="num">${use[k]||0}</td></tr>`).join("")}
  </tbody></table></div>`;
})();

$("#foot").innerHTML = `<div>갱신: <span class="mono">15_CT 성적서\\갱신.bat</span> — ERP 자동 로그인으로 전 품목을 받고, 불량률 대시보드에서 건별 불량을 받아 이 화면과 「CT 성적서_리스트.xlsx」를 다시 만듭니다.</div>
<div>새 결과서는 <span class="mono">원본</span> 폴더에 넣고 클로드에게 「CT 업데이트」라고 하면 읽어서 <span class="mono">_data\\ct_reports.json</span>에 더합니다.</div>
<div>불량 자료: ${esc(DATA.자료.불량.출처)} (반품메모 기준, 고객 정보 없음)</div>`;

/* 결과서 원본 크게 보기 */
(function lightbox(){
  const lb = $("#lb"), img = $("#lb-img");
  let back = null;
  const close = () => { lb.hidden = true; img.removeAttribute("src"); document.body.style.overflow = ""; if (back) back.focus(); };
  document.addEventListener("click", e => {
    const t = e.target.closest(".thumb");
    if (t) { back = t; img.src = t.dataset.img; img.alt = t.getAttribute("aria-label") || ""; lb.hidden = false; lb.scrollTop = 0; document.body.style.overflow = "hidden"; $("#lb-x").focus(); return; }
    if (!lb.hidden && (e.target === lb || e.target.id === "lb-x")) close();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !lb.hidden) close(); });
})();

show(location.hash.slice(1));
</script>
